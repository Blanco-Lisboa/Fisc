<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiscal · Colaborador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --laranja:#FE4901;--laranjaAc:#FF9200;--laranjaTx:#D43D00;--laranjaSv:#FFF1EA;--laranjaCl:#FFD0B5;
  --ink:#111114;--ink2:#1C1C1F;--grafite:#3F3F46;--apoio:#52525B;--apagado:#6B6B72;--nevoa:#A1A1AA;
  --pagina:#FFFFFF;--superf:#FAFAFA;--superf2:#F4F4F5;--borda:#E4E4E7;--bordaF:#D4D4D8;
  --verde:#1B7A44;--verdeSv:#DCF0E4;--vermelho:#C0392B;--vermelhoSv:#F8DAD6;--ambar:#B25E09;--ambarSv:#F6E2C8;--azul:#3A5A8C;--azulSv:#E5EAF2;--roxo:#6D4AA0;--roxoSv:#F0EAF8;
  --grad:linear-gradient(135deg,var(--laranja),var(--laranjaAc));
  --disp:'Space Grotesk',sans-serif;--corpo:'Geist',system-ui,-apple-system,Segoe UI,sans-serif;
  --sm:0 1px 2px rgba(17,17,20,.06);--md:0 8px 24px rgba(17,17,20,.08);--r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--superf2);color:var(--ink);font-family:var(--corpo);font-size:13px;line-height:1.5;display:flex;flex-direction:row;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--laranjaTx);outline-offset:2px}
.disp{font-family:var(--disp)}
.tnum{font-variant-numeric:tabular-nums}
/* ===== MENU LATERAL (padrão dos módulos) ===== */
.side{width:246px;flex:none;background:#0b0b0d;color:#c9c9cf;height:100vh;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.brand2{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.brand2 .lg{width:34px;height:34px;border-radius:9px;display:block;object-fit:cover;flex:none}
.brand2 b{font-family:var(--disp);font-size:18px;color:#fff}
.brand2 .rl{font-size:9.5px;color:#7a7a82;display:block;margin-top:-2px}
.lab{font-size:10px;font-weight:700;letter-spacing:.11em;color:#63636b;margin:15px 8px 6px}
.it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#c7c7cd;font-size:13.5px;cursor:pointer;flex:none}
.it:hover{background:rgba(255,255,255,.05)}
#navPessoal{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ic{width:18px;height:18px;display:grid;place-items:center;flex:none}
.it .ic svg{width:18px;height:18px;fill:none;stroke:#c7c7cd;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it.on{background:rgba(254,73,1,.15);color:#fff;box-shadow:inset 2px 0 0 var(--laranja)}
.it.on .ic svg{stroke:var(--laranja)}
.it .bd{margin-left:auto;font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--vermelho);color:#fff}
.sub{margin-left:18px;padding-left:14px;border-left:1px dashed #33333b;display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
.sub .it{position:relative;border-width:1px;border-style:solid}
.sub .it::before{content:"";position:absolute;left:-14px;top:50%;width:13px;border-top:1px dashed #33333b}
.swa{background:#0e3d2c;border-color:#1f7a52;color:#dff5ea}
.swa .bd{background:#1f8f5a;color:#fff}
.it.swa.on{background:#12513a;color:#fff;box-shadow:inset 2px 0 0 #2fae6e}
.it.swa.on .ic svg{stroke:#dff5ea}
.sem{background:#3d1606;border-color:#a8380a;color:#ffe7da}
.sem .bd{background:var(--laranja);color:#fff}
.it.sem.on{background:#55200a;color:#fff;box-shadow:inset 2px 0 0 #ff7a3d}
.it.sem.on .ic svg{stroke:#ffe7da}
.stm{background:#0e2a4d;border-color:#1f4f8f;color:#dfe9f8}
.stm .bd{background:#2f6fed;color:#fff}
.it.stm.on{background:#13386a;color:#fff;box-shadow:inset 2px 0 0 #4f8ef5}
.it.stm.on .ic svg{stroke:#dfe9f8}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 4px;border-top:1px solid #1c1c22}
.side .foot .av{width:32px;height:32px;border-radius:999px;background:var(--grad);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.side .foot b{font-size:13px;color:#fff;display:block;line-height:1.15}.side .foot span{font-size:11px;color:#7a7a82}
/* ===== ÁREA PRINCIPAL ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topo{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--pagina);border-bottom:1px solid var(--borda);flex:none}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--apoio)}
.crumb b{color:var(--ink);font-weight:600}.crumb .sep{color:var(--apagado)}
.proto{font-size:10px;font-weight:700;color:#111;background:var(--laranjaAc);padding:3px 8px;border-radius:999px}
.iaon{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--roxo);background:var(--roxoSv);padding:5px 10px;border-radius:999px}
.iaon .pt{width:7px;height:7px;border-radius:999px;background:var(--roxo)}
.cresce{flex:1}
.seg{display:flex;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--apoio);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px}
.seg button.on{background:var(--ink);color:#fff}
.comp{display:flex;align-items:center;gap:8px;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:4px 6px}
.comp button{width:24px;height:24px;border:1px solid var(--borda);border-radius:999px;background:var(--pagina);color:var(--laranjaTx);display:grid;place-items:center}
.comp .v{font-family:var(--disp);font-weight:600;font-size:12.5px;min-width:104px;text-align:center}
.conteudo{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;background:var(--superf2)}
/* apuração: clientes | workspace | ia */
.subhdr{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--pagina);border-bottom:1px solid var(--borda);font-size:11px;color:var(--apagado)}
.cols{display:grid;grid-template-columns:296px minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr);gap:14px;flex:1;min-height:0;padding:14px}
.pane{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sm);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.paneH{padding:11px 14px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:8px;flex:none}
.paneH .t{font-family:var(--disp);font-weight:700;font-size:13px}
.rolar{overflow-y:auto;flex:1;min-height:0}
.busca{display:flex;align-items:center;gap:7px;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:7px 11px;margin:10px}
.busca input{border:0;background:transparent;outline:0;flex:1;font-size:12px}
.cli{padding:10px 12px;border-bottom:1px solid var(--superf2);cursor:pointer;display:flex;gap:10px;align-items:center}
.cli:hover{background:var(--superf)}
.cli.sel{background:var(--laranjaSv)}
.av{border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--grad);flex:none}
.cli .av{width:36px;height:36px;font-size:12px}
.cli .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .mt{font-size:10px;color:var(--apagado);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
.pf{font-size:9px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--superf2);color:var(--apoio)}
.anel{margin-left:auto;position:relative;width:34px;height:34px;flex:none}
.anel svg{transform:rotate(-90deg)}
.anel .p{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;font-family:var(--disp)}
.ws{overflow-y:auto}
.wsCab{padding:14px;border-bottom:1px solid var(--borda);display:flex;gap:12px;align-items:center;flex:none}
.wsCab .av{width:48px;height:48px;border-radius:13px;font-size:16px}
.wsCab .nm{font-family:var(--disp);font-size:17px;font-weight:700}
.wsCab .sb{font-size:11.5px;color:var(--apagado)}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-ok{background:var(--verdeSv);color:var(--verde)}.b-fim{background:var(--vermelhoSv);color:var(--vermelho)}.b-pend{background:var(--ambarSv);color:var(--ambar)}
.secTit{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);font-weight:700;margin:0 0 8px;flex:none}
.wsGrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:16px;padding:14px;flex:1;min-height:0}
@media(max-width:900px){.wsGrid{grid-template-columns:1fr;overflow-y:auto}}
.wsCol{min-width:0;display:flex;flex-direction:column;min-height:0}
.pipeV{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.lockTag{margin-left:auto;font-size:11px;color:var(--apagado)}
.lockEd{margin-top:6px;width:100%;border:1px dashed var(--bordaF);background:transparent;border-radius:8px;padding:4px;font-size:10px;color:var(--apagado);display:flex;gap:5px;align-items:center;justify-content:center}
.lockEd:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.stage{min-width:0;background:var(--superf);border:1px solid var(--borda);border-radius:12px;padding:11px;position:relative}
.stage.cur{border-color:var(--laranja);box-shadow:0 0 0 3px var(--laranjaSv)}
.stage.done{background:var(--verdeSv);border-color:#bfe0cb}
.stage .si{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.stage .ic{width:26px;height:26px;border-radius:8px;background:var(--pagina);border:1px solid var(--borda);display:grid;place-items:center;font-size:13px}
.stage.done .ic{background:var(--verde);color:#fff;border-color:var(--verde)}
.stage .nm{font-weight:700;font-size:12px}
.stage .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-block}
.st-af{background:var(--superf2);color:var(--apoio)}.st-an{background:var(--laranjaSv);color:var(--laranjaTx)}.st-agu{background:var(--ambarSv);color:var(--ambar)}.st-cc{background:var(--verdeSv);color:var(--verde)}
.stage .ai{font-size:10.5px;color:var(--roxo);background:var(--roxoSv);border-radius:7px;padding:5px 7px;margin-top:7px;line-height:1.35}
.docpack{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.dchip{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--superf2);color:var(--apoio);border:1px solid var(--borda)}
.dchip.ok{background:var(--verdeSv);color:var(--verde);border-color:#bfe0cb}
.stage .act{margin-top:7px;width:100%;border:0;border-radius:8px;padding:6px;font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center;justify-content:center}
.act-wpp{background:var(--grad);color:#fff}
.act-done{background:transparent;border:1px solid var(--verde);color:var(--verde)}
.act-flow{background:var(--ambarSv);color:var(--ambar)}
.wpp{margin:0;border:1px solid var(--borda);border-radius:12px;overflow:hidden;background:var(--superf);display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:var(--sm)}
.wppH{background:var(--pagina);border-bottom:1px solid var(--borda);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.wppMs{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;background:#efe7de;background-image:radial-gradient(rgba(17,17,20,.03) 1px,transparent 0);background-size:15px 15px}
.bo{max-width:82%;padding:7px 10px;border-radius:11px;font-size:12px;box-shadow:var(--sm)}
.be{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.bs{align-self:flex-end;background:#e7ffdb;border:1px solid #cdeeba;border-top-right-radius:3px}
.bt{align-self:flex-end;background:#eafce0;border:1px dashed #2fae6e;border-top-right-radius:3px}
.bt .sl{font-size:9px;font-weight:700;color:var(--verde);display:block;margin-bottom:2px}
.bo .doc{display:flex;gap:6px;align-items:center;background:var(--superf2);border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:10.5px}
.bo .doc .ic{background:var(--vermelhoSv);color:var(--vermelho);font-weight:700;font-size:8.5px;padding:3px 5px;border-radius:4px}
.bo .meta{font-size:9px;color:var(--apagado);text-align:right;margin-top:3px}
.btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.btns span{background:var(--pagina);border:1px solid var(--laranjaCl);color:var(--laranjaTx);border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:600}
.flowc{background:var(--pagina);border:1px solid var(--borda);border-radius:8px;margin-top:5px;overflow:hidden}
.flowc .fh{background:var(--ambarSv);color:var(--ambar);font-size:10px;font-weight:700;padding:4px 8px}
.flowc .fi{font-size:11px;padding:5px 8px;border-top:1px solid var(--superf2)}
.wppQa{display:flex;gap:6px;padding:8px;border-top:1px solid var(--borda);flex-wrap:wrap;background:var(--pagina)}
.wppQa button{border:1px solid var(--borda);background:var(--pagina);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:600;color:var(--apoio)}
.wppQa button:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.wppCp{display:flex;gap:7px;padding:8px;border-top:1px solid var(--borda);background:var(--pagina);align-items:center}
.wppCp input{flex:1;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:7px 12px;outline:0;font-size:12px}
.wppCp .snd{width:34px;height:34px;border-radius:999px;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;flex:none}
.wppLock{padding:8px;text-align:center;color:var(--apagado);font-size:11px;border-top:1px solid var(--borda);background:var(--pagina)}
.ia{overflow-y:auto;padding:0}
.iaBloco{padding:12px 14px;border-bottom:1px solid var(--superf2)}
.iaBloco .rt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--roxo);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.iaCard{background:var(--roxoSv);border:1px solid #e2d5f2;border-radius:10px;padding:10px}
.iaCard .tt{font-weight:700;font-size:12px}
.iaCard .tx{font-size:11.5px;color:var(--grafite);margin-top:3px}
.iaCard .b{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.miniB{border:1px solid var(--bordaF);background:var(--pagina);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600}
.miniB.rx{border-color:var(--roxo);color:var(--roxo)}
.rascunho{background:var(--pagina);border:1px solid var(--borda);border-radius:10px;padding:9px;font-size:11.5px;color:var(--grafite)}
.demCli{background:var(--pagina);border:1px solid var(--borda);border-left:3px solid var(--roxo);border-radius:10px;padding:9px}
.mcpNota{font-size:10.5px;color:var(--apagado);padding:12px 14px;background:var(--superf);line-height:1.55}
.mcpNota b{color:var(--ink);font-weight:600}
.tela{padding:20px 24px;overflow-y:auto;flex:1}
.tela h1{font-family:var(--disp);font-size:23px;margin:0 0 3px}
.tela .intro{color:var(--apoio);margin:0 0 16px;font-size:13.5px;max-width:82ch}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--borda);background:var(--pagina);color:var(--apoio);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs .c{background:var(--vermelho);color:#fff;border-radius:999px;font-size:9px;padding:0 5px;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cardP{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:14px;box-shadow:var(--sm)}
.cardP .top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.cardP .av{width:30px;height:30px;font-size:11px}
.cardP .nm{font-weight:600;font-size:12.5px}
.cardP .corpo{background:var(--superf);border:1px solid var(--borda);border-radius:9px;padding:10px;font-size:12px;color:var(--grafite)}
.cardP .foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.var{background:var(--laranjaSv);color:var(--laranjaTx);border-radius:5px;padding:0 4px;font-weight:600}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.t-util{background:var(--verdeSv);color:var(--verde)}.t-flow{background:var(--ambarSv);color:var(--ambar)}.t-ia{background:var(--roxoSv);color:var(--roxo)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbwrap{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--r);background:var(--pagina)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--superf2);white-space:nowrap}
th{background:var(--superf);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--verdeSv);color:var(--verde)}.pill.pend{background:var(--ambarSv);color:var(--ambar)}.pill.falta{background:var(--vermelhoSv);color:var(--vermelho)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:12px}
.kcol{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:10px;min-height:220px}
.kh{font-family:var(--disp);font-weight:700;font-size:12.5px;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.kcard{background:var(--superf);border:1px solid var(--borda);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.kt{font-weight:600;font-size:12px}.km{font-size:10.5px;color:var(--apagado);margin-top:3px}
.kf{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.selo{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px}
.selo.ceo{background:var(--roxoSv);color:var(--roxo)}.selo.cupula{background:var(--azulSv);color:var(--azul)}.selo.crit{background:var(--vermelhoSv);color:var(--vermelho)}
.flowGrande{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:14px;box-shadow:var(--sm)}
.flowGrande .campos{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.flowGrande .cc{background:var(--superf);border:1px solid var(--borda);border-radius:8px;padding:6px 11px;font-size:12px}
.passo{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--superf2)}
.passo .n{width:24px;height:24px;border-radius:999px;background:var(--verde);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:11px}
.passo .n.pend{background:var(--ambar)}
.logIA{background:var(--pagina);border:1px solid var(--borda);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;gap:9px;align-items:flex-start;font-size:12px}
.logIA .ic{width:26px;height:26px;border-radius:7px;background:var(--roxoSv);color:var(--roxo);display:grid;place-items:center;flex:none}
/* WhatsApp Web (janela geral) */
.waweb{display:grid;grid-template-columns:340px minmax(0,1fr);flex:1;min-height:0}
.walist{border-right:1px solid var(--borda);display:flex;flex-direction:column;min-height:0;background:var(--pagina)}
.watabs{display:flex;gap:6px;padding:10px 10px 8px;border-bottom:1px solid var(--borda);flex:none}
.watabs button{flex:1;border:1px solid var(--borda);background:var(--pagina);color:var(--apoio);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.watabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.watabs .c{background:var(--verde);color:#fff;border-radius:999px;font-size:9px;padding:0 5px;font-weight:700}
.watabs button.on .c{background:#fff;color:var(--ink)}
.bt-assumir{background:var(--grad);color:#fff;border:0;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700}
.walist .srch{padding:10px;border-bottom:1px solid var(--borda);flex:none}
.walist .srch input{width:100%;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:8px 13px;font-size:12px;outline:0;font-family:inherit}
.walist .rl{overflow-y:auto;flex:1;min-height:0}
.waconv{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid var(--superf2);cursor:pointer;align-items:center}
.waconv:hover{background:var(--superf)}.waconv.sel{background:var(--laranjaSv)}
.waconv .av{width:42px;height:42px;font-size:13px}
.waconv .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.waconv .hr{font-size:9.5px;color:var(--apagado);font-weight:500;flex:none}
.waconv .last{font-size:11px;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.waconv .un{background:var(--verde);color:#fff;border-radius:999px;font-size:9px;font-weight:700;padding:1px 6px;flex:none}
.wachat{display:flex;flex-direction:column;min-height:0;background:#efe7de}
.wachat .ch{background:var(--pagina);border-bottom:1px solid var(--borda);padding:9px 15px;display:flex;align-items:center;gap:11px;flex:none}
.wachat .ms{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(17,17,20,.03) 1px,transparent 0);background-size:15px 15px}
.wachat .cp{display:flex;gap:8px;padding:10px 12px;background:var(--pagina);border-top:1px solid var(--borda);align-items:center;flex:none}
.wachat .cp input{flex:1;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:9px 14px;outline:0;font-size:12.5px;font-family:inherit}
.wachat .cp .snd{width:38px;height:38px;border-radius:999px;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;flex:none}
/* ===== Componente WhatsApp (mesmo do Societário) — fundo bege mantido ===== */
.wa-wrap{border:1px solid var(--borda);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:var(--sm)}
.wa-head{background:#0B3D2E;color:#fff;display:flex;align-items:center;gap:9px;padding:9px 12px;flex:none}
.wa-head .wapp{width:28px;height:28px;border-radius:999px;background:#25D366;display:grid;place-items:center;flex:none}
.wa-head .wapp svg{width:16px;height:16px;fill:#fff}
.wa-head .avc{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.wa-head .nm{flex:1;min-width:0}.wa-head .nm b{font-size:13px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-head .nm span{font-size:10.5px;opacity:.82}
.wa-head .wstat2{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:#fff;flex:none;white-space:nowrap;color:var(--robo,var(--verde))}
.wa-head .wstat2.ped{color:var(--laranjaTx)}
.wa-msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:#efe7de;background-image:radial-gradient(rgba(17,17,20,.03) 1px,transparent 0);background-size:15px 15px}
.wa-b{max-width:84%;padding:9px 11px;border-radius:13px;font-size:12.5px;line-height:1.5;white-space:pre-line;box-shadow:var(--sm)}
.wa-b.ag{align-self:flex-end;background:#1c1c1e;color:#fff;border-bottom-right-radius:4px}
.wa-b.cl{align-self:flex-start;background:#fff;border:1px solid var(--borda);color:var(--ink);border-bottom-left-radius:4px}
.wa-t{font-size:10px;color:var(--apagado);margin:2px 3px 9px}
.wa-t.ag{align-self:flex-end}.wa-t.cl{align-self:flex-start}
.wa-tpl{font-size:9px;font-weight:700;opacity:.7;margin-bottom:3px}
.wa-doc{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:7px;padding:5px 7px;margin-bottom:4px;font-size:10.5px}
.wa-b.cl .wa-doc{background:var(--superf2)}
.wa-doc .fi{background:var(--vermelhoSv);color:var(--vermelho);font-weight:700;font-size:8.5px;padding:3px 5px;border-radius:4px}
.wa-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.wa-btns span{background:rgba(255,255,255,.14);border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:600}
.wa-b.cl .wa-btns span{background:var(--superf2);color:var(--laranjaTx)}
.wa-flow{background:rgba(255,255,255,.1);border-radius:7px;padding:6px 8px;margin-top:6px;font-size:10.5px}
.wa-quick{display:flex;gap:6px;padding:8px;flex-wrap:wrap;background:#fff;border-top:1px solid var(--borda);flex:none}
.wa-quick button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:5px 11px;font-size:10.5px;font-weight:600;color:var(--apoio)}
.wa-quick button:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.wa-comp{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--borda);background:#fff;flex:none}
.wa-comp .pl{width:38px;height:38px;border-radius:999px;border:1px solid var(--bordaF);background:#fff;display:grid;place-items:center;color:var(--apoio);flex:none;cursor:pointer;font-size:20px}
.wa-comp .pl svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wa-comp input{flex:1;border:1px solid var(--bordaF);border-radius:999px;padding:11px 15px;font-size:12.5px;font-family:inherit;outline:0;background:var(--superf2)}
.wa-comp .snd{width:40px;height:40px;border-radius:999px;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;font-size:15px;flex:none;cursor:pointer}
.wa-lock{padding:12px;text-align:center;color:var(--apagado);font-size:11px;border-top:1px solid var(--borda);background:#fff;flex:none}
.watabs .wa-ico{flex:none;width:34px;padding:0;color:var(--apoio)}
.wa-arqlin{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;font-weight:600;color:var(--apoio);border-bottom:1px solid var(--superf2);cursor:pointer;flex:none}
.wa-arqlin:hover{background:var(--superf)}.wa-arqlin span{margin-left:auto;color:var(--verde);font-size:11px}
.wa-mini{color:var(--apagado);display:grid;place-items:center;flex:none}
.wa-seta{border:0;background:transparent;color:var(--apagado);padding:0;width:18px;height:18px;display:none;place-items:center;flex:none}
.waconv:hover .wa-seta{display:grid}
.wa-hbtn{border:0;background:transparent;color:#fff;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none}
.wa-hbtn:hover{background:rgba(255,255,255,.14)}
.wa-bbusca{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--borda);flex:none}
.wa-bbusca input{flex:1;border:1px solid var(--bordaF);border-radius:999px;padding:7px 13px;font-size:12px;font-family:inherit;outline:0;background:var(--superf2)}
.wa-linha{display:flex;flex-direction:column;max-width:84%}
.wa-linha.ag{align-self:flex-end;align-items:flex-end}.wa-linha.cl{align-self:flex-start;align-items:flex-start}
.wa-linha .wa-b{max-width:100%;position:relative;padding-right:24px}
.wa-bseta{position:absolute;top:3px;right:3px;border:0;background:transparent;color:inherit;opacity:0;width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:6px}
.wa-b:hover .wa-bseta{opacity:.7}
.wa-autor{font-size:11px;font-weight:700;color:var(--laranjaTx);margin-bottom:2px}
.wa-enc{font-size:10.5px;font-style:italic;opacity:.7;margin-bottom:2px}
.wa-cit{border-left:3px solid var(--laranja);background:rgba(127,127,127,.12);border-radius:6px;padding:4px 8px;margin-bottom:5px;font-size:11px;display:flex;flex-direction:column}
.wa-cit b{font-size:10.5px;color:var(--laranjaTx)}.wa-b.ag .wa-cit b{color:#ffb38a}
.wa-cit span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;opacity:.85}
.wa-img{display:block;max-width:260px;max-height:260px;border-radius:8px;margin-bottom:3px;cursor:pointer}
.wa-reac{background:#fff;border:1px solid var(--borda);border-radius:999px;padding:1px 7px;font-size:12px;margin-top:-6px;z-index:1;box-shadow:var(--sm)}
.wa-resp{display:flex;align-items:center;gap:8px;padding:8px 12px 0;background:#fff;border-top:1px solid var(--borda);flex:none}
.wa-resp .q{flex:1;min-width:0;border-left:3px solid var(--laranja);background:var(--superf2);border-radius:6px;padding:5px 9px;display:flex;flex-direction:column;font-size:11.5px}
.wa-resp .q b{color:var(--laranjaTx);font-size:11px}.wa-resp .q span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-resp button{border:0;background:transparent;color:var(--apagado);font-size:14px}
.wa-rec{color:var(--vermelho);font-weight:700;font-size:12.5px}
.wa-menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--borda);border-radius:10px;box-shadow:var(--md);padding:5px;display:flex;flex-direction:column;min-width:190px}
.wa-menu button{border:0;background:transparent;text-align:left;padding:8px 11px;font-size:12.5px;border-radius:7px;color:var(--ink);font-family:inherit}
.wa-menu button:hover{background:var(--superf)}.wa-menu button.perigo{color:var(--vermelho)}
.wa-menu.wa-emojis{flex-direction:row;min-width:0;border-radius:999px;padding:4px 6px}
.wa-menu.wa-emojis button{font-size:20px;padding:4px 6px;border-radius:999px}.wa-menu.wa-emojis button.on{background:var(--laranjaSv)}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:85}
.toast{background:var(--ink);color:#fff;padding:9px 15px;border-radius:999px;font-size:12.5px;box-shadow:var(--md)}
.modal{position:fixed;inset:0;background:rgba(17,17,20,.45);display:grid;place-items:center;z-index:75;padding:16px}
.mcx{background:var(--pagina);border-radius:16px;width:min(460px,96vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--md)}
.mcab{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--borda)}
.mcab b{flex:1;font-family:var(--disp)}.mcab .x{width:28px;height:28px;border-radius:8px;background:var(--superf2);border:0}
.mbody{padding:14px 16px;overflow-y:auto}
.arq{display:flex;align-items:center;gap:10px;border:1px solid var(--borda);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.arq.sel{border-color:var(--laranja);background:var(--laranjaSv)}
.arq .ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--bordaF);display:grid;place-items:center;flex:none;font-size:10px;color:transparent}
.arq.sel .ck{background:var(--laranja);color:#fff;border-color:var(--laranja)}
.arq .nm{flex:1;font-size:12px;font-weight:600}.arq .tam{font-size:10px;color:var(--apagado)}
.arq select{margin-top:6px;width:100%;border:1px solid var(--borda);border-radius:7px;padding:4px 7px;font-size:11px}
.mrod{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--borda)}
.bwpp{background:var(--verde);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.bwpp:disabled{opacity:.5;cursor:not-allowed}
/* abas + botões dentro de Apuração */
.aputabs{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 14px 0;background:var(--pagina);border-bottom:1px solid var(--borda);flex:none}
.aputabs-l{display:flex;gap:4px}
.aputabs-r{display:flex;gap:8px;padding-bottom:7px}
.aputabs-l button{position:relative;border:1px solid var(--borda);border-bottom:0;background:var(--superf);color:var(--apoio);border-radius:10px 10px 0 0;padding:8px 15px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center;top:1px}
.aputabs-l button.on{background:var(--pagina);color:var(--ink);box-shadow:inset 0 2px 0 var(--laranja)}
.apubtn{border:1px solid var(--bordaF);background:var(--pagina);color:var(--grafite);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.apubtn:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.apubtn2{border:1px solid var(--borda);background:var(--superf);color:var(--apoio);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600}
.apubtn2.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.palrow{display:flex;gap:6px;align-items:center}
.palrow .cor{width:18px;height:18px;border-radius:999px;cursor:pointer;border:2px solid transparent}
.palrow .cor.on{border-color:var(--ink)}
.aputabs .nb{background:var(--laranja);color:#fff;border-radius:999px;font-size:9.5px;font-weight:800;padding:1px 6px;min-width:16px;text-align:center}
.aputabs .c2{background:var(--superf2);color:var(--apoio);border-radius:999px;font-size:9.5px;font-weight:700;padding:0 6px}
.aputabs button.on .c2{background:var(--laranjaSv);color:var(--laranjaTx)}
.apuBody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* radar: linha nova */
tr.rnovo{background:var(--laranjaSv)}
tr.rnovo:hover{background:#ffe6d6}
.ndot{width:9px;height:9px;border-radius:999px;background:var(--laranja);display:inline-block;box-shadow:0 0 0 3px var(--laranjaSv)}
/* demanda em lote */
.loteBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:11px 13px;margin-bottom:14px;box-shadow:var(--sm)}
.loteBar label{font-size:11px;font-weight:700;color:var(--apagado);text-transform:uppercase;letter-spacing:.05em}
.loteBar select{border:1px solid var(--borda);border-radius:9px;padding:8px 11px;font-size:12.5px;background:var(--pagina);font-family:inherit;min-width:230px}
.loteBar .bwpp{margin-left:auto}
.loteCard{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.loteCard:hover{border-color:var(--laranjaCl)}
.loteCard.sel{border-color:var(--laranja);box-shadow:0 0 0 3px var(--laranjaSv)}
.ckq{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--bordaF);display:grid;place-items:center;flex:none;font-size:11px;color:#fff;font-weight:800}
.loteCard.sel .ckq{background:var(--laranja);border-color:var(--laranja)}
/* meu espaço */
.lista2{display:flex;flex-direction:column;gap:8px;max-width:720px}
.itemE{display:flex;align-items:center;gap:11px;background:var(--pagina);border:1px solid var(--borda);border-radius:11px;padding:11px 13px;box-shadow:var(--sm);font-size:12.5px}
.itemE .ckq{cursor:pointer}
.itemE.ok .ckq{background:var(--verde);border-color:var(--verde)}
.itemE .xdel{margin-left:auto;width:26px;height:26px;border-radius:8px;background:var(--superf2);border:0;color:var(--apagado);font-size:12px}
.itemE .xdel:hover{background:var(--vermelhoSv);color:var(--vermelho)}
/* tarefa exclusiva do cliente */
.addTarefa{margin-top:8px;flex:none;width:100%;border:1px dashed var(--laranjaCl);background:var(--laranjaSv);color:var(--laranjaTx);border-radius:10px;padding:9px;font-size:12px;font-weight:700}
.addTarefa:hover{border-color:var(--laranja)}
.stage.cust{border-left:3px solid var(--laranja)}
.escTag{margin-left:auto;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--laranjaSv);color:var(--laranjaTx)}
/* escopo da IA */
.iaEscopo{display:flex;gap:5px}
.iaEscopo button{flex:1;border:1px solid var(--borda);background:var(--pagina);color:var(--apoio);border-radius:8px;padding:7px 4px;font-size:11px;font-weight:700}
.iaEscopo button.on{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.iaLim{width:100%;margin-top:7px;border:1px solid var(--borda);border-radius:8px;padding:7px 9px;font-size:11.5px;font-family:inherit;background:var(--pagina)}
.iaEscopoTxt{font-size:11px;color:var(--apoio);margin-top:7px;line-height:1.4}
.iaOff{font-size:12px;color:var(--apoio);background:var(--superf);border:1px dashed var(--bordaF);border-radius:10px;padding:11px;line-height:1.45}
/* campos de modal */
.mbody .fl{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado);font-weight:700;margin:10px 0 5px}
.mbody .fl:first-child{margin-top:0}
.mbody .fi{width:100%;border:1px solid var(--borda);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:inherit;outline:0}
.mbody .fi:focus{border-color:var(--laranja)}
.cg{display:flex;flex-direction:column;gap:18px}
.cg-sec{display:flex;flex-direction:column;gap:10px}
.cg-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cg-cab h2{font-family:var(--disp);font-size:15px;margin:0}
.cg-sub{font-size:11.5px;color:var(--apagado);margin-top:2px}
.cg-card{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sm);padding:16px;min-width:0}
.cg-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cg-kpi .rot{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--apagado);font-weight:600}
.cg-kpi .val{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.cg-kpi .rod{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--apoio)}
.cg-delta{font-weight:700;border-radius:999px;padding:1px 8px;font-size:11px}
.cg-delta.ruim{background:var(--vermelhoSv);color:var(--vermelho)}.cg-delta.bom{background:var(--verdeSv);color:var(--verde)}
.cg-alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cg-alerta{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding-left:20px}
.cg-alerta.clic{cursor:pointer}
.cg-alerta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cor)}
.cg-alerta .cg-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cg-alerta .n{font-family:var(--disp);font-size:28px;font-weight:700;color:var(--cor);font-variant-numeric:tabular-nums}
.cg-alerta b{font-size:13px}.cg-alerta .d{font-size:11.5px;color:var(--apagado)}
.cg-alerta .ver{font-size:11.5px;color:var(--laranjaTx);font-weight:600;margin-top:auto}
.cg-sev{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--fundo);color:var(--cor);text-transform:uppercase;letter-spacing:.05em}
.cg-ciclo{display:flex;flex-direction:column;gap:16px}
.cg-etapa{display:grid;grid-template-columns:190px 1fr 150px;gap:14px;align-items:center}
.cg-etapa .nm b{font-size:13px;display:block}.cg-etapa .nm span{font-size:11px;color:var(--apagado)}
.cg-barra{position:relative;height:22px;border-radius:7px;background:var(--superf2);display:flex}
.cg-barra .s{height:100%}.cg-barra .s:first-child{border-radius:7px 0 0 7px}

/* ===== WHATSAPP (console de atendimento) ===== */
.wz{--laranja:#FE4901;--laranjaAc:#FF9200;--laranjaTx:#C93A00;--laranjaSv:#FFF3EC;--laranjaCl:#FFD5BF;--ink:#16161A;--grafite:#3B3B42;--apoio:#55555E;--apagado:#74747C;--nevoa:#A6A6AE;--pagina:#FFFFFF;--fundo:#F3F2EF;--superf:#FAFAF8;--superf2:#F1F0ED;--borda:#E6E4DF;--bordaF:#D6D3CC;--verde:#18794A;--verdeSv:#E1F3E8;--vermelho:#BF3426;--vermelhoSv:#FBE3DF;--ambar:#A65A06;--ambarSv:#FBEBD3;--azul:#2F5DA8;--azulSv:#E6EDF8;--chat:#F6F4F0;--sai:#FFF1E8;--saiBorda:#FFD9C4;--grad:linear-gradient(135deg,var(--laranja),var(--laranjaAc));--sm:0 1px 2px rgba(22,22,26,.05);--md:0 10px 30px rgba(22,22,26,.10);
 flex:1;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr) 300px;background:var(--pagina);color:var(--ink);font-size:13px;line-height:1.45}

.wz-fila{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--borda);background:var(--superf)}
.wz-ftop{padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;background:var(--pagina);border-bottom:1px solid var(--borda)}

.wz-num{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--apoio);background:var(--verdeSv);border:1px solid #CBE9D7;border-radius:999px;padding:4px 10px 4px 8px;white-space:nowrap}
.wz-num i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px rgba(24,121,74,.18)}

.wz-ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--borda);background:var(--pagina);display:grid;place-items:center;color:var(--grafite);flex:none}

.wz-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.wz-cd{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.wz-nl{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--laranja);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}

.wz-mk{display:flex;color:var(--nevoa)}
.wz-mk svg{width:13px;height:13px}
.wz-cseta{position:absolute;right:8px;top:30px;border:0;background:var(--pagina);border-radius:7px;width:24px;height:22px;display:none;place-items:center;color:var(--apagado);box-shadow:var(--sm)}
.wz-conv:hover .wz-cseta{display:grid}
.wz-conversa{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--chat)}
.wz-cab{background:var(--pagina);border-bottom:1px solid var(--borda);padding:11px 16px;display:flex;align-items:center;gap:12px}

.wz-cab .t{flex:1;min-width:0;cursor:pointer}

.wz-cab .t span{font-size:12px;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wz-med{display:flex;flex-direction:column;gap:4px;min-width:150px;padding:6px 11px;border:1px solid #CBE9D7;background:var(--verdeSv);border-radius:10px}

const ICO_PLAN='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/></svg>';
let cartUsuario=null,plan=null;
const PL_SIT={ok:['ok','Pronto'],ja_na_carteira:['cz','Já está na carteira'],em_outra_carteira:['pend','Em outra carteira'],repetido:['cz','Repetido'],invalido:['falta','CNPJ inválido'],nao_encontrado:['falta','Não encontrado'],sem_vinculo_you:['falta','Sem vínculo com a YOU'],inativo:['falta','Empresa inativa']};
const PL_ERRO=['invalido','nao_encontrado','sem_vinculo_you','inativo'];
function escolherPlanilha(){
 const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv,.txt';
 i.onchange=()=>{if(i.files[0])lerPlanilha(i.files[0]);};i.click();

function celulaTexto(v){
 if(v==null)return '';
 if(typeof v==='number')return Number.isFinite(v)?String(Math.round(v)):'';
 return String(v).trim();
}
async function lerPlanilha(f){
 let col=[];
 try{
  if(/\.(csv|txt)$/i.test(f.name)){
   col=(await f.text()).replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(/[;\t]/)[0].replace(/^"|"$/g,'').trim());
  }else{
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];
   col=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,blankrows:true,defval:null}).map(r=>celulaTexto((r||[])[0]));
  }
 }catch(e){toast('Não foi possível ler a planilha.');return;}
 while(col.length&&!col[col.length-1])col.pop();
 let ini=0;while(ini<col.length&&!/\d/.test(col[ini]))ini++;
 col=col.slice(ini);
 if(!col.length){toast('A planilha não tem CNPJ na primeira coluna.');return;}
 if(col.length>5000){toast('A planilha passa de 5000 linhas.');return;}
 plan={arquivo:f.name,linhas:[],ocupado:false};
 renderPlanilha(true);
 const cheias=col.map((v,i)=>({v,linha:i+1+ini})).filter(x=>String(x.v||'').trim());
 const r=await cartConferir(cheias.map(x=>x.v));
 if(!plan)return;
 if(r.erro){plan=null;toast('Não foi possível conferir a planilha.');renderCarteira();return;}
 plan.linhas=r.linhas.map((l,i)=>({...l,linha:cheias[i].linha,transferir:false,descartado:false,editando:''}));
 renderPlanilha();
}
function plContas(){
 const L=plan.linhas.filter(l=>!l.descartado);
 const c=s=>L.filter(l=>l.situacao===s).length;
 const vinc=L.filter(l=>l.situacao==='ok'||(l.situacao==='em_outra_carteira'&&l.transferir));
 return {total:plan.linhas.length,ok:c('ok'),ja:c('ja_na_carteira'),outra:c('em_outra_carteira'),rep:c('repetido'),erro:L.filter(l=>PL_ERRO.includes(l.situacao)).length,desc:plan.linhas.filter(l=>l.descartado).length,vinc};
}
function renderPlanilha(carregando){
 const b=el('cartBody');if(!b||!plan)return;

 const k=plContas();
 const ord={invalido:0,nao_encontrado:0,sem_vinculo_you:0,inativo:0,em_outra_carteira:1,repetido:2,ok:3,ja_na_carteira:4};

 if((l.situacao==='ok'||l.situacao==='em_outra_carteira')&&l.grupo&&l.grupo.length)sit+=` <span style="font-size:11px;color:var(--apoio)">leva junto ${l.grupo.length} ${l.grupo.length>1?'empresas':'empresa'} do mesmo cliente</span>`;

 else if(l.situacao==='em_outra_carteira')acao=`<label style="display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;white-space:nowrap"><input type="checkbox" ${l.transferir?'checked':''} onchange="plan.linhas[${i}].transferir=this.checked;renderPlanilha()"> Transferir para esta carteira</label>`;

 return apBolha({d:'sai',cab:h&&h.format==='TEXT'?h.text:null,doc:h&&h.format==='DOCUMENT'?(doc?doc.name:'Documento.pdf'):null,t:modTexto(m,vals||[]),rod:f?f.text:null,btns:bt?bt.buttons.map(x=>x.text):null,dt:'',h:''});}

function modEscolher(nome){

function modDesenharForm(){

function modEscolherDoc(){const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>100*1048576){toast('PDF acima de 100 MB.');return;}modDoc=f;modDesenharForm();};i.click();}
async function modEnviar(){
 const m=modSel;if(!m)return;const vs=modVars(m),h=modParte(m,'HEADER');
 if(vs.some(v=>!String(modVals[v.i-1]||'').trim())){toast('Preencha todos os campos.');return;}
 if(h&&h.format==='DOCUMENT'&&!modDoc){toast('Anexe o PDF.');return;}
 const b=el('modEnv');if(b)b.disabled=true;
 const ok=await modCtx.enviar(m,vs.map(v=>String(modVals[v.i-1]).trim()),modDoc,modTexto(m,modVals));
 if(ok)fecharModal();else if(b)b.disabled=false;
}
async function waEnviarModelo(c,m,vals,doc,previa){
 const id_local=crypto.randomUUID();const comps=[];
 if(doc){const caminho=`${c.id}/saida/${id_local}.pdf`;const up=await sb.storage.from('wa-midia').upload(caminho,doc,{contentType:'application/pdf'});
  if(up.error){toast('Não foi possível subir o PDF.');return false;}
  const sg=await sb.storage.from('wa-midia').createSignedUrl(caminho,1800);if(sg.error){toast('Não foi possível preparar o PDF.');return false;}
  comps.push({type:'header',parameters:[{type:'document',document:{link:sg.data.signedUrl,filename:doc.name}}]});}
 if(vals.length)comps.push({type:'body',parameters:vals.map(t=>({type:'text',text:t}))});
 c.wpp.push({id:'tmp-'+id_local,id_local,tipo:'texto',d:'sai',t:previa,h:hhmm(new Date()),dt:ddmm(new Date()),em:new Date().toISOString(),st:'enviando',autor:eu.nome.split(' ')[0]});waDesenharMsgs();
 const j=await waEdge('wa-meta-enviar',{conversa_id:c.id,id_local,tipo:'template',template:{nome:m.nome,idioma:m.idioma||'pt_BR',componentes:comps,previa}});
 if(!j.ok){const x=c.wpp.find(y=>y.id_local===id_local);if(x)x.st=j.incerto?'incerto':'falhou';waDesenharMsgs();toast(j.erro||'Não foi possível enviar o modelo.');return false;}
 toast('Modelo enviado.');return true;
}
async function waModelos(id,pref){
 const c=waConv(id);if(!c)return;const ctx={nome:c.nome,empresa:'',cnpj:'',enviar:(m,v,d,p)=>waEnviarModelo(c,m,v,d,p)};
 if(c.contatoId){const r=await sb.from('wa_pessoa_vinculo').select('wa_vinculo_alcance(empresa_id,escopo,ativo)').eq('contato_id',c.contatoId).eq('ativo',true);
  const ids=[...new Set((r.data||[]).flatMap(v=>(v.wa_vinculo_alcance||[]).filter(a=>a.ativo&&a.escopo==='empresa'&&a.empresa_id).map(a=>a.empresa_id)))];

 modAbrir(ctx,pref);
}

function webmParaOgg(b){

 const MESTRES=new Set([0x18538067,0x1F43B675,0x1654AE6B,0xAE,0xA0]);
 while(p<b.length-2){const id=vint(true).v;const tam=vint(false);const ini=p;
  if(MESTRES.has(id))continue;
  const fim=tam.todos?b.length:Math.min(b.length,ini+tam.v);
  if(id===0x63A2)cab=b.slice(ini,fim);
  else if(id===0xA3||id===0xA1){p=ini;vint(false);p+=3;pac.push(b.slice(p,fim));}
  p=fim;}
 if(!cab||!pac.length)throw new Error('sem audio');
 const CRC=new Uint32Array(256);for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?((r<<1)^0x04c11db7)>>>0:(r<<1)>>>0;CRC[i]=r>>>0;}
 const serial=(Math.random()*0xffffffff)>>>0;let seq=0;const paginas=[];
 const pagina=(dado,gran,tipo)=>{const seg=[];let r=dado.length;while(r>=255){seg.push(255);r-=255;}seg.push(r);
  const h=new Uint8Array(27+seg.length+dado.length);const dv=new DataView(h.buffer);

  let crc=0;for(let i=0;i<h.length;i++)crc=((crc<<8)^CRC[((crc>>>24)^h[i])&0xff])>>>0;dv.setUint32(22,crc,true);paginas.push(h);};
 const amostras=x=>{const toc=x[0],cfg=toc>>3;const ms=cfg<12?[10,20,40,60][cfg%4]:cfg<16?[10,20][cfg%2]:[2.5,5,10,20][cfg%4];const c=toc&3;const nf=c===0?1:c<3?2:(x[1]&0x3f);return Math.round(nf*ms*48);};
 pagina(cab,0,2);

 const tot=paginas.reduce((s,x)=>s+x.length,0);const out=new Uint8Array(tot);let o=0;paginas.forEach(x=>{out.set(x,o);o+=x.length;});return out;
}

 if(tipo==='imagem')return ['img','IMG'];if(tipo==='video')return ['vid','VÍD'];if(tipo==='audio')return ['aud','ÁUD'];
 if(e==='xml')return ['xml','XML'];if(e==='pdf')return ['pdf','PDF'];if(['zip','rar','7z'].includes(e))return ['zip',e.toUpperCase()];
 if(['xls','xlsx','csv','ods'].includes(e))return ['xls',e.toUpperCase()];if(['doc','docx','odt','txt','rtf'].includes(e))return ['doc',e.toUpperCase()];
 return ['',(e||'ARQ').slice(0,4).toUpperCase()];}

function waOndaFalsa(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;const r=[];for(let i=0;i<28;i++){h=(h*1103515245+12345)>>>0;r.push(.25+((h>>>16)%70)/100);}return r;}

async function waPrepararOndas(c){
 for(const m of c.wpp){if(m.tipo!=='audio'||waOndas[m.id]||!m.caminho||!waUrls[m.caminho])continue;
  waOndas[m.id]=waOndaFalsa(m.id);
  try{const b=await (await fetch(waUrls[m.caminho])).arrayBuffer();const ctx=new (window.AudioContext||window.webkitAudioContext)();const a=await ctx.decodeAudioData(b);ctx.close();
   const d=a.getChannelData(0),n=28,p=Math.floor(d.length/n),r=[];let mx=0;
   for(let i=0;i<n;i++){let s=0;for(let j=i*p;j<(i+1)*p;j+=64)s=Math.max(s,Math.abs(d[j]||0));r.push(s);mx=Math.max(mx,s);}
   waOndas[m.id]=r.map(v=>.15+.85*(mx?v/mx:0));m.dur=m.dur||a.duration;
   const o=el('wzo-'+m.id);if(o)o.innerHTML=waOndas[m.id].map(h=>`<i style="height:${Math.round(h*100)}%"></i>`).join('');
   const s=el('wzd-'+m.id);if(s&&!s.textContent)s.textContent=Math.floor(m.dur/60)+':'+String(Math.round(m.dur%60)).padStart(2,'0');}catch(e){}}}

 if(waAudio){waAudio.el.pause();const ant=waAudio.id;waAudio=null;waAudioPintar(ant,0);waAudioIcone(ant);}
 const a=new Audio(u);waAudio={id,el:a};
 a.ontimeupdate=()=>{if(!a.duration)return;waAudioPintar(id,a.currentTime/a.duration);const s=el('wzd-'+id);if(s)s.textContent=Math.floor(a.currentTime/60)+':'+String(Math.floor(a.currentTime%60)).padStart(2,'0');};
 a.onended=()=>{waAudioPintar(id,0);if(waAudio&&waAudio.id===id)waAudio=null;waAudioIcone(id);};

const ST_WA={enviando:'enviando',aguardando:'na fila',enviada:'enviada',entregue:'entregue',lida:'lida',falhou:'falhou',incerto:'sem confirmação'};
let sb=null,eu=null,waEntrada=[],waMeus=[],waMsgs={};
function waConv(id){return waEntrada.find(x=>x.id===id)||waMeus.find(x=>x.id===id);}
function hhmm(d){const x=new Date(d);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');}
function ddmm(d){const x=new Date(d);return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');}
function fmtTel(t){if(!t)return '';const s=String(t);return s.startsWith('55')&&s.length>=12?'+55 '+s.slice(2,4)+' '+s.slice(4,-4)+'-'+s.slice(-4):'+'+s;}
function transcWA(m){const md=Array.isArray(m.wa_midia)?m.wa_midia[0]:m.wa_midia;return md&&md.transcricao?md.transcricao:'';}
function midiaWA(m){const md=Array.isArray(m.wa_midia)?m.wa_midia[0]:m.wa_midia;return md||{};}
function msgWA(m){const tr=m.tipo==='audio'?transcWA(m):'';const md=midiaWA(m);
 return {id:m.id,id_local:m.id_local,idWa:m.id_whatsapp||null,tipo:m.tipo,transcricao:tr,d:m.direcao==='entrada'?'ent':'sai',
  t:m.texto||'',legenda:m.legenda||'',nomeArq:md.nome||(m.tipo==='documento'?m.texto:'')||'',caminho:md.estado==='guardado'?md.caminho:null,midiaEstado:md.estado||null,
  dados:m.dados||null,respondeA:m.responder_a||null,reacao:m.reacao||null,reacaoNossa:m.reacao_nossa||null,encaminhada:!!m.encaminhada,favorita:!!m.favorita,autorGrupo:m.autor_grupo||'',
  h:hhmm(m.ocorrido_em),dt:ddmm(m.ocorrido_em),em:m.ocorrido_em,st:m.status,autor:m.autor_id&&eu&&m.autor_id===eu.id?eu.nome.split(' ')[0]:'',
  autorNome:waAssinatura(m.autor_id?(eu&&m.autor_id===eu.id?eu.nome:(waEquipe[m.autor_id]||'')):''),tam:md.tamanho||0,dur:md.duracao_s||0,modelo:m.dados&&m.dados.modelo||null};}
function janelaWA(c){if(!c.janelaAte){c.janela=false;c.janelaLbl='fechada';return;}
 const rest=waRestante(c);c.janela=rest>0;c.optin=true;
 c.janelaLbl=rest>0?Math.floor(rest/3600e3)+'h'+String(Math.floor(rest%3600e3/60e3)).padStart(2,'0'):'fechada';}
function convWA(c){const ant=waConv(c.id);const ct=Array.isArray(c.wa_contato)?c.wa_contato[0]:c.wa_contato;
 const x={id:c.id,contatoId:c.contato_id,nome:c.contato_nome||fmtTel(c.contato_telefone)||'Contato',telefone:c.contato_telefone,plats:[],regime:'',optin:false,janela:false,janelaLbl:'fechada',
 dono:null,wpp:waMsgs[c.id]||[],carregada:!!waMsgs[c.id],previa:c.ultima_previa,ultima:c.ultima_em,naoLidas:c.nao_lidas||0,janelaAte:c.janela_ate||null,
 arquivada:!!c.arquivada,fixada:c.fixada_em,silenciada:!!c.silenciada,marcadaNL:!!c.marcada_nao_lida,grupo:!!c.grupo_meta_id,grupoLink:c.grupo_link,grupoDesc:c.grupo_descricao,
 bloqueado:!!(ct&&ct.bloqueado)};
 if(ant&&ant._lendo)x._lendo=true;return x;}
async function carregarConversas(){
 const todas=[];await waAcertarRelogio();
 for(let de=0;;de+=1000){
  const r=await sb.from('wa_conversa').select('id,contato_id,contato_nome,contato_telefone,estado,ultima_em,ultima_previa,nao_lidas,janela_ate,arquivada,fixada_em,silenciada,marcada_nao_lida,grupo_meta_id,grupo_link,grupo_descricao,wa_contato(bloqueado),wa_numero!inner(provedor)')
   .eq('wa_numero.provedor','meta_cloud').neq('estado','arquivada').order('ultima_em',{ascending:false,nullsFirst:false}).order('id').range(de,de+999);
  if(r.error){toast('Não foi possível carregar as conversas.');return;}
  todas.push(...r.data);if(r.data.length<1000)break;
 }
 const nv=todas.map(convWA);
 await waCarregarPainel();
 nv.forEach(c=>{const p=waPainel[c.id];c.dono=(p&&p.dono_id)||null;});
 waEntrada=nv.filter(c=>!c.dono);
 waMeus=nv.filter(c=>c.dono===eu.id);
 waAplicarPainel();
 waEntrada.concat(waMeus).forEach(c=>janelaWA(c));waAgendarJanela();
}
const WA_COLUNAS_MSG='id,id_local,id_whatsapp,direcao,tipo,texto,legenda,status,ocorrido_em,autor_id,autor_grupo,responder_a,reacao,reacao_nossa,encaminhada,favorita,dados,wa_midia(nome,caminho,estado,mimetype,transcricao,tamanho,duracao_s)';
const WA_PAGINA=300;let waRolar=null;const waAntigasIndo={};
async function carregarMensagens(id){
 const r=await sb.from('wa_mensagem').select(WA_COLUNAS_MSG)
  .eq('conversa_id',id).is('apagada_em',null).order('ocorrido_em',{ascending:false}).order('id',{ascending:false}).limit(WA_PAGINA);
 if(r.error){toast('Não foi possível carregar as mensagens.');return;}
 waMsgs[id]=r.data.reverse().map(msgWA);const c=waConv(id);if(c){c.wpp=waMsgs[id];c.carregada=true;c.temAntigas=r.data.length===WA_PAGINA;janelaWA(c);}
 if(waChatAberto())render();
}
async function waMaisAntigas(id){
 const c=waConv(id);if(!c||!c.temAntigas||waAntigasIndo[id]||!c.wpp.length)return;
 waAntigasIndo[id]=true;
 const r=await sb.from('wa_mensagem').select(WA_COLUNAS_MSG)
  .eq('conversa_id',id).is('apagada_em',null).lte('ocorrido_em',c.wpp[0].em).order('ocorrido_em',{ascending:false}).order('id',{ascending:false}).limit(WA_PAGINA);
 waAntigasIndo[id]=false;
 if(r.error){toast('Não foi possível carregar as mensagens.');return;}
 c.temAntigas=r.data.length===WA_PAGINA;
 if(!r.data.length)return;
 const ja=new Set(c.wpp.map(m=>m.id));
 waMsgs[id]=r.data.reverse().map(msgWA).filter(m=>!ja.has(m.id)).concat(c.wpp);c.wpp=waMsgs[id];
 const box=el('wwms');if(box&&selWhats===id){waRolar=box.scrollHeight-box.scrollTop;waDesenharMsgs();}
}
document.addEventListener('scroll',e=>{const b=e.target;if(b&&b.id==='wwms'&&b.scrollTop<120&&selWhats)waMaisAntigas(selWhats);},true);
function aoMudarMidia(p){const md=p.new;if(!md||!md.mensagem_id)return;for(const k in waMsgs){const m=waMsgs[k].find(x=>x.id===md.mensagem_id);if(m){
  if(md.transcricao)m.transcricao=md.transcricao;if(md.estado==='guardado'&&md.caminho)m.caminho=md.caminho;if(md.nome)m.nomeArq=md.nome;
  if(waChatAberto()&&selWhats===k)waDesenharMsgs();return;}}}
function aoMudarMensagem(p){const m=p.new;if(!m||!m.conversa_id)return;if(waEsperas[m.id]&&['enviada','entregue','lida','falhou','incerto'].includes(m.status)){const r=waEsperas[m.id];setTimeout(()=>r(m.status),0);}const lista=waMsgs[m.conversa_id];
 if(lista){if(m.apagada_em){waMsgs[m.conversa_id]=lista.filter(x=>x.id!==m.id);const c=waConv(m.conversa_id);if(c)c.wpp=waMsgs[m.conversa_id];}
  else{const i=lista.findIndex(x=>x.id===m.id||(m.id_local&&x.id_local===m.id_local));const ant=i>=0?lista[i]:null;const nova=msgWA(m);
   if(ant){nova.caminho=ant.caminho;nova.nomeArq=nova.nomeArq||ant.nomeArq;nova.transcricao=nova.transcricao||ant.transcricao;nova.midiaEstado=ant.midiaEstado;lista[i]=nova;}else lista.push(nova);
   const c=waConv(m.conversa_id);if(c)janelaWA(c);
   if(!ant&&['imagem','audio','video','documento','figurinha'].includes(m.tipo))setTimeout(()=>carregarMensagens(m.conversa_id),1500);}}
 if(waChatAberto()&&selWhats===m.conversa_id)waDesenharMsgs();}
async function aoMudarConversa(){await carregarConversas();if(view==='whatsweb'){const a=document.activeElement;if(a&&(a.id==='wwin'||a.id==='wwbmsg'))return;render();}else{const b=el('waBadge');if(b)b.textContent=waPendentes();}}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiscal · Colaborador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --laranja:#FE4901;--laranjaAc:#FF9200;--laranjaTx:#D43D00;--laranjaSv:#FFF1EA;--laranjaCl:#FFD0B5;
  --ink:#111114;--ink2:#1C1C1F;--grafite:#3F3F46;--apoio:#52525B;--apagado:#6B6B72;--nevoa:#A1A1AA;
  --pagina:#FFFFFF;--superf:#FAFAFA;--superf2:#F4F4F5;--borda:#E4E4E7;--bordaF:#D4D4D8;
  --verde:#1B7A44;--verdeSv:#DCF0E4;--vermelho:#C0392B;--vermelhoSv:#F8DAD6;--ambar:#B25E09;--ambarSv:#F6E2C8;--azul:#3A5A8C;--azulSv:#E5EAF2;--roxo:#6D4AA0;--roxoSv:#F0EAF8;
  --grad:linear-gradient(135deg,var(--laranja),var(--laranjaAc));
  --disp:'Space Grotesk',sans-serif;--corpo:'Geist',system-ui,-apple-system,Segoe UI,sans-serif;
  --sm:0 1px 2px rgba(17,17,20,.06);--md:0 8px 24px rgba(17,17,20,.08);--r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--superf2);color:var(--ink);font-family:var(--corpo);font-size:13px;line-height:1.5;display:flex;flex-direction:row;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--laranjaTx);outline-offset:2px}
.disp{font-family:var(--disp)}
.tnum{font-variant-numeric:tabular-nums}

/* ===== MENU LATERAL (padrão dos módulos) ===== */
.side{width:246px;flex:none;background:#0b0b0d;color:#c9c9cf;height:100vh;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.brand2{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.brand2 .lg{width:34px;height:34px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:12px}
.brand2 b{font-family:var(--disp);font-size:18px;color:#fff}
.brand2 .rl{font-size:9.5px;color:#7a7a82;display:block;margin-top:-2px}
.lab{font-size:10px;font-weight:700;letter-spacing:.11em;color:#63636b;margin:15px 8px 6px}
.it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#c7c7cd;font-size:13.5px;cursor:pointer;flex:none}
.it:hover{background:rgba(255,255,255,.05)}
.it .ic{width:18px;height:18px;display:grid;place-items:center;flex:none}
.it .ic svg{width:18px;height:18px;fill:none;stroke:#c7c7cd;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it.on{background:rgba(254,73,1,.15);color:#fff;box-shadow:inset 2px 0 0 var(--laranja)}
.it.on .ic svg{stroke:var(--laranja)}
.it .bd{margin-left:auto;font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--vermelho);color:#fff}
.sub{margin-left:18px;padding-left:14px;border-left:1px dashed #33333b;display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
.sub .it{position:relative;border-width:1px;border-style:solid}
.sub .it::before{content:"";position:absolute;left:-14px;top:50%;width:13px;border-top:1px dashed #33333b}
.swa{background:#0e3d2c;border-color:#1f7a52;color:#dff5ea}
.swa .bd{background:#1f8f5a;color:#fff}
.it.swa.on{background:#12513a;color:#fff;box-shadow:inset 2px 0 0 #2fae6e}
.it.swa.on .ic svg{stroke:#dff5ea}
.stm{background:#0e2a4d;border-color:#1f4f8f;color:#dfe9f8}
.stm .bd{background:#2f6fed;color:#fff}
.it.stm.on{background:#13386a;color:#fff;box-shadow:inset 2px 0 0 #4f8ef5}
.it.stm.on .ic svg{stroke:#dfe9f8}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 4px;border-top:1px solid #1c1c22}
.side .foot .av{width:32px;height:32px;border-radius:999px;background:var(--grad);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.side .foot b{font-size:13px;color:#fff;display:block;line-height:1.15}.side .foot span{font-size:11px;color:#7a7a82}

/* ===== ÁREA PRINCIPAL ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topo{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--pagina);border-bottom:1px solid var(--borda);flex:none}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--apoio)}
.crumb b{color:var(--ink);font-weight:600}.crumb .sep{color:var(--apagado)}
.proto{font-size:10px;font-weight:700;color:#111;background:var(--laranjaAc);padding:3px 8px;border-radius:999px}
.iaon{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--roxo);background:var(--roxoSv);padding:5px 10px;border-radius:999px}
.iaon .pt{width:7px;height:7px;border-radius:999px;background:var(--roxo)}
.cresce{flex:1}
.seg{display:flex;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--apoio);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px}
.seg button.on{background:var(--ink);color:#fff}
.comp{display:flex;align-items:center;gap:8px;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:4px 6px}
.comp button{width:24px;height:24px;border:1px solid var(--borda);border-radius:999px;background:var(--pagina);color:var(--laranjaTx);display:grid;place-items:center}
.comp .v{font-family:var(--disp);font-weight:600;font-size:12.5px;min-width:104px;text-align:center}
.conteudo{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;background:var(--superf2)}

/* apuração: clientes | workspace | ia */
.subhdr{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--pagina);border-bottom:1px solid var(--borda);font-size:11px;color:var(--apagado)}
.cols{display:grid;grid-template-columns:296px minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr);gap:14px;flex:1;min-height:0;padding:14px}
.pane{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sm);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.paneH{padding:11px 14px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:8px;flex:none}
.paneH .t{font-family:var(--disp);font-weight:700;font-size:13px}
.rolar{overflow-y:auto;flex:1;min-height:0}

.busca{display:flex;align-items:center;gap:7px;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:7px 11px;margin:10px}
.busca input{border:0;background:transparent;outline:0;flex:1;font-size:12px}
.cli{padding:10px 12px;border-bottom:1px solid var(--superf2);cursor:pointer;display:flex;gap:10px;align-items:center}
.cli:hover{background:var(--superf)}
.cli.sel{background:var(--laranjaSv)}
.av{border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--grad);flex:none}
.cli .av{width:36px;height:36px;font-size:12px}
.cli .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .mt{font-size:10px;color:var(--apagado);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
.pf{font-size:9px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--superf2);color:var(--apoio)}
.anel{margin-left:auto;position:relative;width:34px;height:34px;flex:none}
.anel svg{transform:rotate(-90deg)}
.anel .p{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;font-family:var(--disp)}

.ws{overflow-y:auto}
.wsCab{padding:14px;border-bottom:1px solid var(--borda);display:flex;gap:12px;align-items:center;flex:none}
.wsCab .av{width:48px;height:48px;border-radius:13px;font-size:16px}
.wsCab .nm{font-family:var(--disp);font-size:17px;font-weight:700}
.wsCab .sb{font-size:11.5px;color:var(--apagado)}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-ok{background:var(--verdeSv);color:var(--verde)}.b-fim{background:var(--vermelhoSv);color:var(--vermelho)}.b-pend{background:var(--ambarSv);color:var(--ambar)}
.secTit{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);font-weight:700;margin:0 0 8px;flex:none}
.wsGrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:16px;padding:14px;flex:1;min-height:0}
@media(max-width:900px){.wsGrid{grid-template-columns:1fr;overflow-y:auto}}
.wsCol{min-width:0;display:flex;flex-direction:column;min-height:0}
.pipeV{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.lockTag{margin-left:auto;font-size:11px;color:var(--apagado)}
.lockEd{margin-top:6px;width:100%;border:1px dashed var(--bordaF);background:transparent;border-radius:8px;padding:4px;font-size:10px;color:var(--apagado);display:flex;gap:5px;align-items:center;justify-content:center}
.lockEd:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.stage{min-width:0;background:var(--superf);border:1px solid var(--borda);border-radius:12px;padding:11px;position:relative}
.stage.cur{border-color:var(--laranja);box-shadow:0 0 0 3px var(--laranjaSv)}
.stage.done{background:var(--verdeSv);border-color:#bfe0cb}
.stage .si{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.stage .ic{width:26px;height:26px;border-radius:8px;background:var(--pagina);border:1px solid var(--borda);display:grid;place-items:center;font-size:13px}
.stage.done .ic{background:var(--verde);color:#fff;border-color:var(--verde)}
.stage .nm{font-weight:700;font-size:12px}
.stage .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-block}
.st-af{background:var(--superf2);color:var(--apoio)}.st-an{background:var(--laranjaSv);color:var(--laranjaTx)}.st-agu{background:var(--ambarSv);color:var(--ambar)}.st-cc{background:var(--verdeSv);color:var(--verde)}
.stage .ai{font-size:10.5px;color:var(--roxo);background:var(--roxoSv);border-radius:7px;padding:5px 7px;margin-top:7px;line-height:1.35}
.docpack{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.dchip{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--superf2);color:var(--apoio);border:1px solid var(--borda)}
.dchip.ok{background:var(--verdeSv);color:var(--verde);border-color:#bfe0cb}
.stage .act{margin-top:7px;width:100%;border:0;border-radius:8px;padding:6px;font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center;justify-content:center}
.act-wpp{background:var(--grad);color:#fff}
.act-done{background:transparent;border:1px solid var(--verde);color:var(--verde)}
.act-flow{background:var(--ambarSv);color:var(--ambar)}

.wpp{margin:0;border:1px solid var(--borda);border-radius:12px;overflow:hidden;background:var(--superf);display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:var(--sm)}
.wppH{background:var(--pagina);border-bottom:1px solid var(--borda);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.wppMs{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;background:#efe7de;background-image:radial-gradient(rgba(17,17,20,.03) 1px,transparent 0);background-size:15px 15px}
.bo{max-width:82%;padding:7px 10px;border-radius:11px;font-size:12px;box-shadow:var(--sm)}
.be{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.bs{align-self:flex-end;background:#e7ffdb;border:1px solid #cdeeba;border-top-right-radius:3px}
.bt{align-self:flex-end;background:#eafce0;border:1px dashed #2fae6e;border-top-right-radius:3px}
.bt .sl{font-size:9px;font-weight:700;color:var(--verde);display:block;margin-bottom:2px}
.bo .doc{display:flex;gap:6px;align-items:center;background:var(--superf2);border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:10.5px}
.bo .doc .ic{background:var(--vermelhoSv);color:var(--vermelho);font-weight:700;font-size:8.5px;padding:3px 5px;border-radius:4px}
.bo .meta{font-size:9px;color:var(--apagado);text-align:right;margin-top:3px}
.btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.btns span{background:var(--pagina);border:1px solid var(--laranjaCl);color:var(--laranjaTx);border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:600}
.flowc{background:var(--pagina);border:1px solid var(--borda);border-radius:8px;margin-top:5px;overflow:hidden}
.flowc .fh{background:var(--ambarSv);color:var(--ambar);font-size:10px;font-weight:700;padding:4px 8px}
.flowc .fi{font-size:11px;padding:5px 8px;border-top:1px solid var(--superf2)}
.wppQa{display:flex;gap:6px;padding:8px;border-top:1px solid var(--borda);flex-wrap:wrap;background:var(--pagina)}
.wppQa button{border:1px solid var(--borda);background:var(--pagina);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:600;color:var(--apoio)}
.wppQa button:hover{border-color:var(--laranja);color:var(--laranjaTx)}
.wppCp{display:flex;gap:7px;padding:8px;border-top:1px solid var(--borda);background:var(--pagina);align-items:center}
.wppCp input{flex:1;background:var(--superf2);border:1px solid var(--borda);border-radius:999px;padding:7px 12px;outline:0;font-size:12px}
.wppCp .snd{width:34px;height:34px;border-radius:999px;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;flex:none}
.wppLock{padding:8px;text-align:center;color:var(--apagado);font-size:11px;border-top:1px solid var(--borda);background:var(--pagina)}

.ia{overflow-y:auto;padding:0}
.iaBloco{padding:12px 14px;border-bottom:1px solid var(--superf2)}
.iaBloco .rt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--roxo);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.iaCard{background:var(--roxoSv);border:1px solid #e2d5f2;border-radius:10px;padding:10px}
.iaCard .tt{font-weight:700;font-size:12px}
.iaCard .tx{font-size:11.5px;color:var(--grafite);margin-top:3px}
.iaCard .b{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.miniB{border:1px solid var(--bordaF);background:var(--pagina);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600}
.miniB.rx{border-color:var(--roxo);color:var(--roxo)}
.rascunho{background:var(--pagina);border:1px solid var(--borda);border-radius:10px;padding:9px;font-size:11.5px;color:var(--grafite)}
.demCli{background:var(--pagina);border:1px solid var(--borda);border-left:3px solid var(--roxo);border-radius:10px;padding:9px}
.mcpNota{font-size:10.5px;color:var(--apagado);padding:12px 14px;background:var(--superf);line-height:1.55}
.mcpNota b{color:var(--ink);font-weight:600}

.tela{padding:20px 24px;overflow-y:auto;flex:1}
.tela h1{font-family:var(--disp);font-size:23px;margin:0 0 3px}
.tela .intro{color:var(--apoio);margin:0 0 16px;font-size:13.5px;max-width:82ch}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--borda);background:var(--pagina);color:var(--apoio);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs .c{background:var(--vermelho);color:#fff;border-radius:999px;font-size:9px;padding:0 5px;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cardP{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:14px;box-shadow:var(--sm)}
.cardP .top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.cardP .av{width:30px;height:30px;font-size:11px}
.cardP .nm{font-weight:600;font-size:12.5px}
.cardP .corpo{background:var(--superf);border:1px solid var(--borda);border-radius:9px;padding:10px;font-size:12px;color:var(--grafite)}
.cardP .foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.var{background:var(--laranjaSv);color:var(--laranjaTx);border-radius:5px;padding:0 4px;font-weight:600}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.t-util{background:var(--verdeSv);color:var(--verde)}.t-flow{background:var(--ambarSv);color:var(--ambar)}.t-ia{background:var(--roxoSv);color:var(--roxo)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbwrap{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--r);background:var(--pagina)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--superf2);white-space:nowrap}
th{background:var(--superf);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--verdeSv);color:var(--verde)}.pill.pend{background:var(--ambarSv);color:var(--ambar)}.pill.falta{background:var(--vermelhoSv);color:var(--vermelho)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:12px}
.kcol{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:10px;min-height:220px}
.kh{font-family:var(--disp);font-weight:700;font-size:12.5px;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.kcard{background:var(--superf);border:1px solid var(--borda);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.kt{font-weight:600;font-size:12px}.km{font-size:10.5px;color:var(--apagado);margin-top:3px}
.kf{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.selo{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px}
.selo.ceo{background:var(--roxoSv);color:var(--roxo)}.selo.cupula{background:var(--azulSv);color:var(--azul)}.selo.crit{background:var(--vermelhoSv);color:var(--vermelho)}
.flowGrande{background:var(--pagina);border:1px solid var(--borda);border-radius:var(--r);padding:14px;box-shadow:var(--sm)}
.flowGrande .campos{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.flowGrande .cc{background:var(--superf);border:1px solid var(--borda);border-radius:8px;padding:6px 11px;font-size:12px}
.passo{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--superf2)}
.passo .n{width:24px;height:24px;border-radius:999px;background:var(--verde);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:11px}
.passo .n.pend{background:var(--ambar)}
.logIA{background:var(--pagina);border:1px solid var(--borda);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;gap:9px;align-items:flex-start;font-size:12px}
.logIA .ic{width:26px;height:26px;border-radius:7px;background:var(--roxoSv);color:var(--roxo);display:grid;place-items:center;flex:none}

/* WhatsApp Web (janela geral) */
.waweb{display:grid;grid-template-columns:340px minmax(0,1fr);flex:1;min-height:0}
.walist{border-right:1px solid var(--borda);display:flex;flex-direction:column;min-height:0;background:var(--pagina)}
.watabs{display:flex;gap:6px;padding:10px 10px 8px;border-bottom:1px solid var(--borda);flex:none}
.watabs button{flex:1;border:1px solid var(--borda);background:var(--pagina);color:var(--apoio);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.watabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

let cliBusca='',cliApu='',cliPag=1,cliPorPag=0,cliObs=null,cliApuAberto=false;
function soDig(s){return String(s||'').replace(/\D/g,'');}
function cliLinhas(){
 const t=cliBusca.trim().toLowerCase(),td=soDig(cliBusca);const out=[];
 (clientesDados||[]).forEach(g=>g.empresas.forEach(e=>{
  if(cliApu&&(e.apuracao||'')!==cliApu)return;
  if(t){const txt=[g.responsavel,e.empresa,e.carteira].join(' ').toLowerCase();
   const ok=txt.includes(t)||(td.length>=3&&(soDig(g.cpf).includes(td)||soDig(e.cnpj).includes(td)));if(!ok)return;}
  out.push({g,e});}));
 return out;
}
function cliOpcoesApu(){return [...new Set((clientesDados||[]).flatMap(g=>g.empresas.map(e=>e.apuracao)).filter(Boolean))].sort();}
function renderClientes(){
 const b=el('gestorBody');if(!b)return;
 if(!clientesDados){b.innerHTML='';carregarClientes();return;}
 b.innerHTML=`<div class="tela" style="display:flex;flex-direction:column;overflow:hidden;gap:10px">
  <div class="busca" style="margin:0;max-width:520px">🔎<input id="cliBuscaIn" placeholder="Buscar por responsável, CPF, CNPJ, empresa ou carteira" value="${escH(cliBusca)}" oninput="cliBusca=this.value;cliPag=1;desenharClientes()"></div>

  <div id="cliPager" style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:30px"></div></div>`;
 if(cliObs)cliObs.disconnect();

function cliTabela(linhas){
 const ops=cliOpcoesApu();
 let html=`<table style="table-layout:fixed"><colgroup><col style="width:24%"><col style="width:15%"><col style="width:33%"><col style="width:16%"><col style="width:12%"></colgroup><thead><tr><th style="background:var(--ink);color:#fff;font-weight:700;border-bottom:2px solid var(--laranja)">Responsável</th><th style="background:var(--ink);color:#fff;font-weight:700;border-bottom:2px solid var(--laranja)">CNPJ</th><th style="background:var(--ink);color:#fff;font-weight:700;border-bottom:2px solid var(--laranja)">Empresa</th><th style="background:var(--ink);color:#fff;font-weight:700;border-bottom:2px solid var(--laranja)">Carteira</th><th style="position:relative;overflow:visible;background:var(--ink);color:#fff;font-weight:700;border-bottom:2px solid var(--laranja)">Apuração <button class="miniB" style="padding:1px 6px;margin-left:4px;color:var(--ink)${cliApu?';border-color:var(--laranja);color:var(--laranjaTx)':''}" onclick="event.stopPropagation();cliApuAberto=!cliApuAberto;desenharClientes()">▾</button>${cliApuAberto?`<div class="cardP" style="position:absolute;right:8px;top:30px;z-index:5;padding:6px;min-width:160px;text-transform:none;letter-spacing:0;font-size:12px">${['',...ops].map(o=>`<div style="padding:6px 8px;border-radius:6px;cursor:pointer;${o===cliApu?'background:var(--superf2);font-weight:700':''}" onclick="cliApu='${escH(o)}';cliApuAberto=false;cliPag=1;desenharClientes()">${o?escH(o):'Todas'}</div>`).join('')}</div>`:''}</th></tr></thead><tbody>`;
 let k=0;
 while(k<linhas.length){
  const g=linhas[k].g;let n=0;while(k+n<linhas.length&&linhas[k+n].g===g)n++;
  for(let m=0;m<n;m++){const e=linhas[k+m].e;
   html+=`<tr>${m===0?`<td rowspan="${n}" title="${escH(g.responsavel||'')}" style="vertical-align:middle;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);border-right:1px solid var(--borda);background:var(--pagina)">${escH(g.responsavel||'—')}</td>`:''}<td style="overflow:hidden;text-overflow:ellipsis">${fmtCnpj(e.cnpj)}</td><td title="${escH(e.empresa)}" style="overflow:hidden;text-overflow:ellipsis">${escH(e.empresa)}</td><td title="${escH(e.carteira||'')}" style="overflow:hidden;text-overflow:ellipsis">${escH(e.carteira||'—')}</td><td style="overflow:hidden;text-overflow:ellipsis">${e.apuracao?escH(e.apuracao):'—'}</td></tr>`;}
  k+=n;}
 return html+'</tbody></table>';
}
function desenharClientes(){
 const w=el('cliWrap'),p=el('cliPager');if(!w||!p)return;
 const linhas=cliLinhas();
 if(!cliPorPag){
  w.innerHTML=cliTabela(linhas.slice(0,1));
  const th=w.querySelector('thead'),tr=w.querySelector('tbody tr');
  const hH=th?th.getBoundingClientRect().height:36,rH=tr?tr.getBoundingClientRect().height:38;
  cliPorPag=Math.max(1,Math.floor((w.clientHeight-hH-2)/rH));
 }
 const tot=Math.max(1,Math.ceil(linhas.length/cliPorPag));if(cliPag>tot)cliPag=tot;
 w.innerHTML=cliTabela(linhas.slice((cliPag-1)*cliPorPag,cliPag*cliPorPag));
 const nums=new Set([1,tot]);for(let i=cliPag-2;i<=cliPag+2;i++)if(i>=1&&i<=tot)nums.add(i);
 const lista=[...nums].sort((a,b)=>a-b);let html='',ant=0;
 const bt=(i,t)=>`<button class="miniB" style="min-width:32px${i===cliPag?';background:var(--ink);color:#fff;border-color:var(--ink)':''}" onclick="cliPag=${i};desenharClientes()">${t||i}</button>`;
 if(cliPag>1)html+=bt(cliPag-1,'‹');
 lista.forEach(i=>{if(i-ant>1)html+='<span style="color:var(--apagado)">…</span>';html+=bt(i);ant=i;});
 if(cliPag<tot)html+=bt(cliPag+1,'›');
 p.innerHTML=html+`<span style="font-size:11px;color:var(--apagado);margin-left:8px">${linhas.length} CNPJ</span>`;
}

const ICO_PLAN='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/></svg>';
let cartUsuario=null,plan=null;
const PL_SIT={ok:['ok','Pronto'],ja_na_carteira:['cz','Já está na carteira'],em_outra_carteira:['pend','Em outra carteira'],repetido:['cz','Repetido'],invalido:['falta','CNPJ inválido'],nao_encontrado:['falta','Não encontrado'],sem_vinculo_you:['falta','Sem vínculo com a YOU'],inativo:['falta','Empresa inativa']};
const PL_ERRO=['invalido','nao_encontrado','sem_vinculo_you','inativo'];
function escolherPlanilha(){
 const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv,.txt';
 i.onchange=()=>{if(i.files[0])lerPlanilha(i.files[0]);};i.click();
}
function celulaTexto(v){
 if(v==null)return '';
 if(typeof v==='number')return Number.isFinite(v)?String(Math.round(v)):'';
 return String(v).trim();
}
async function lerPlanilha(f){
 let col=[];
 try{
  if(/\.(csv|txt)$/i.test(f.name)){
   col=(await f.text()).replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(/[;\t]/)[0].replace(/^"|"$/g,'').trim());
  }else{
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];
   col=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,blankrows:true,defval:null}).map(r=>celulaTexto((r||[])[0]));
  }
 }catch(e){toast('Não foi possível ler a planilha.');return;}
 while(col.length&&!col[col.length-1])col.pop();
 let ini=0;while(ini<col.length&&!/\d/.test(col[ini]))ini++;
 col=col.slice(ini);
 if(!col.length){toast('A planilha não tem CNPJ na primeira coluna.');return;}
 if(col.length>5000){toast('A planilha passa de 5000 linhas.');return;}
 plan={arquivo:f.name,linhas:[],ocupado:false};
 renderPlanilha(true);
 const r=await sb.rpc('fiscal_carteira_analisar',{p_usuario:cartUsuario,p_linhas:col});
 if(!plan)return;
 if(r.error){plan=null;toast('Não foi possível conferir a planilha.');renderCarteira();return;}
 plan.linhas=(r.data||[]).filter(l=>l.situacao!=='vazio').map(l=>({...l,linha:l.linha+ini,transferir:false,descartado:false,editando:''}));
 renderPlanilha();
}
function plContas(){
 const L=plan.linhas.filter(l=>!l.descartado);
 const c=s=>L.filter(l=>l.situacao===s).length;
 const vinc=L.filter(l=>l.situacao==='ok'||(l.situacao==='em_outra_carteira'&&l.transferir));
 return {total:plan.linhas.length,ok:c('ok'),ja:c('ja_na_carteira'),outra:c('em_outra_carteira'),rep:c('repetido'),erro:L.filter(l=>PL_ERRO.includes(l.situacao)).length,desc:plan.linhas.filter(l=>l.descartado).length,vinc};
}
function renderPlanilha(carregando){
 const b=el('cartBody');if(!b||!plan)return;
 if(carregando){b.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:30px 4px;color:var(--apoio);font-size:12.5px">${ICO_PLAN} ${escH(plan.arquivo)}</div>`;return;}
 const k=plContas();
 const ord={invalido:0,nao_encontrado:0,sem_vinculo_you:0,inativo:0,em_outra_carteira:1,repetido:2,ok:3,ja_na_carteira:4};
 const lin=plan.linhas.map((l,i)=>({l,i})).sort((a,b)=>(a.l.descartado-b.l.descartado)||(ord[a.l.situacao]-ord[b.l.situacao])||(a.l.linha-b.l.linha));
 const PL_CZ='background:var(--superf2);color:var(--apoio)';
 const chip=(n,t,cls)=>`<span class="pill ${cls}" style="font-size:11px;padding:4px 10px;${cls==='cz'?PL_CZ:''}">${n} ${n===1?t[0]:t[1]}</span>`;
 const parcial=k.erro||k.desc||k.outra>k.vinc.filter(l=>l.situacao==='em_outra_carteira').length;
 b.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
   <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600">${ICO_PLAN} ${escH(plan.arquivo)} <span style="color:var(--apagado);font-weight:400">· ${k.total} linhas</span></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${chip(k.ok,['pronto','prontos'],'ok')}${k.outra?chip(k.outra,['em outra carteira','em outra carteira'],'pend'):''}${k.erro?chip(k.erro,['com problema','com problema'],'falta'):''}${k.ja?chip(k.ja,['já na carteira','já na carteira'],'cz'):''}${k.rep?chip(k.rep,['repetido','repetidos'],'cz'):''}${k.desc?chip(k.desc,['descartado','descartados'],'cz'):''}</div></div>
  <div class="tbwrap" style="max-height:52vh;overflow-y:auto"><table><thead><tr><th style="width:60px">Linha</th><th>CNPJ</th><th>Empresa</th><th>Situação</th><th style="width:1%"></th></tr></thead><tbody>${lin.map(({l,i})=>plLinha(l,i)).join('')}</tbody></table></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap">
   <button class="apubtn" onclick="plCancelar()">Cancelar, não subir</button>
   <button class="bt-assumir" ${k.vinc.length&&!plan.ocupado?'':'disabled style="opacity:.45"'} onclick="plVincular()">${parcial?'Vincular só os válidos':'Vincular'} (${k.vinc.length})</button>
  </div>`;
}
function plLinha(l,i){
 const [cls,txt]=PL_SIT[l.situacao]||['cz',l.situacao];
 const cnpj=l.valido?fmtCnpj(l.cnpj):escH(l.original);
 let sit=`<span class="pill ${cls}" style="${cls==='cz'?'background:var(--superf2);color:var(--apoio)':''}">${txt}</span>`;
 if(l.situacao==='em_outra_carteira')sit+=` <span style="font-size:11px;color:var(--apoio)">de ${escH(l.dono||'')}</span>`;
 if(l.situacao==='repetido')sit+=` <span style="font-size:11px;color:var(--apagado)">ignorado</span>`;
 if(l.zeros_completados)sit+=` <span style="font-size:11px;color:var(--apagado)">zeros completados</span>`;
 let acao='';
 if(l.descartado)acao=`<button class="miniB" onclick="plDescartar(${i},false)">Desfazer</button>`;
 else if(PL_ERRO.includes(l.situacao))acao=`<div style="display:flex;gap:6px;align-items:center"><input placeholder="CNPJ correto" value="${escH(l.editando)}" oninput="plan.linhas[${i}].editando=this.value" onkeydown="if(event.key==='Enter')plCorrigir(${i})" style="width:130px;border:1px solid var(--borda);border-radius:8px;padding:5px 8px;font-size:11.5px;font-family:inherit;outline:0"><button class="miniB" onclick="plCorrigir(${i})">Conferir</button><button class="miniB" onclick="plDescartar(${i},true)">Descartar</button></div>`;
 else if(l.situacao==='em_outra_carteira')acao=`<label style="display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;white-space:nowrap"><input type="checkbox" ${l.transferir?'checked':''} onchange="plan.linhas[${i}].transferir=this.checked;renderPlanilha()"> Transferir para esta carteira</label>`;
 return `<tr style="${l.descartado?'opacity:.45':''}"><td style="color:var(--apagado)">${l.linha}</td><td style="font-variant-numeric:tabular-nums">${cnpj}</td><td style="max-width:230px;overflow:hidden;text-overflow:ellipsis">${escH(l.empresa||'—')}</td><td>${sit}</td><td>${acao}</td></tr>`;
}
function plDescartar(i,v){plan.linhas[i].descartado=v;renderPlanilha();}
async function plCorrigir(i){
 const l=plan.linhas[i];const v=(l.editando||'').trim();if(!v)return;
 const r=await sb.rpc('fiscal_carteira_analisar',{p_usuario:cartUsuario,p_linhas:[v]});
 if(!plan)return;
 if(r.error||!r.data||!r.data[0]){toast('Não foi possível conferir o CNPJ.');return;}
 const n=r.data[0];
 if(n.valido&&plan.linhas.some((o,j)=>j!==i&&!o.descartado&&o.valido&&o.cnpj===n.cnpj&&o.situacao!=='repetido'))n.situacao='repetido';
 Object.assign(l,{original:n.original,cnpj:n.cnpj,valido:n.valido,zeros_completados:n.zeros_completados,situacao:n.situacao,empresa_id:n.empresa_id,empresa:n.empresa,dono:n.dono,dono_id:n.dono_id,editando:PL_ERRO.includes(n.situacao)?v:'',transferir:false});

async function tmGravar(){

 const rec=new MediaRecorder(st,{mimeType:'audio/webm;codecs=opus',audioBitsPerSecond:32000});const partes=[];rec.ondataavailable=e=>{if(e.data.size)partes.push(e.data);};
 tmGrav={rec,st,partes,seg:0,canal:tmAlvo(),cancelado:false};
 tmGrav.timer=setInterval(()=>{if(!tmGrav)return;tmGrav.seg++;const s=document.querySelector('#tmComp .wa-rec,#tmfComp .wa-rec');if(s)s.textContent='● Gravando '+tmGrav.seg+'s';if(tmGrav.seg>=900)tmGravarParar();},1000);
 rec.onstop=async()=>{const g=tmGrav;tmGrav=null;clearInterval(g.timer);g.st.getTracks().forEach(t=>t.stop());tmCompAtualizar();
  if(g.cancelado||!g.partes.length)return;try{const ogg=webmParaOgg(new Uint8Array(await new Blob(g.partes).arrayBuffer()));const ant=tmSel;if(!(tmFlutAberto&&tmFlutCanal===g.canal))tmSel=g.canal;await tmEnviarArquivo(new Blob([ogg],{type:'audio/ogg'}),'audio.ogg','audio');tmSel=ant;}catch(e){toast('Não foi possível preparar o áudio.');}};
 rec.start(250);tmCompAtualizar();
}

 const b=el('tmBol');if(!b)return;
 if(tmBolY==null)b.style.bottom='';else b.style.bottom=tmBolLimite(tmBolY)+'px';
 const f=el('tmFlut');if(f&&b.style.display!=='none'){const W=window.innerWidth,Hj=window.innerHeight,H=Math.min(500,Hj-24),m=10,bot=tmBolY!=null?tmBolLimite(tmBolY):(b.classList.contains('alto')?92:24),r={top:Hj-bot-56,bottom:Hj-bot,left:W-24-56,height:56};

function tmBolArrastavel(b){

 b.addEventListener('pointerdown',e=>{if(e.button!==0)return;ini={y:e.clientY,base:parseInt(getComputedStyle(b).bottom,10)||24,moveu:false};try{b.setPointerCapture(e.pointerId);}catch(x){}});

let tmCall=null,tmSinal=null,tmToque=null;
const TM_ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
async function tmEnviarSinal(uid,event,payload){
 const s=(await tm.auth.getSession()).data.session;if(!s)return;
 await fetch(TM_URL+'/realtime/v1/api/broadcast',{method:'POST',headers:{'Content-Type':'application/json',apikey:TM_KEY,Authorization:'Bearer '+s.access_token},
  body:JSON.stringify({messages:[{topic:'tm-u-'+uid,event,payload:Object.assign({chamada:tmCall?tmCall.id:payload.chamada,de:eu.id},payload),private:true}]})}).catch(()=>{});
}
function tmEscutarLigacoes(){
 tmSinal=tm.channel('tm-u-'+eu.id,{config:{private:true}}).on('broadcast',{event:'*'},m=>tmSinalChegou(m.event,m.payload||{})).subscribe();
}
function tmAlvosDoCanal(c){if(!c)return [];if(c.tipo==='setor')return (tmEquipe.pessoas||[]).filter(p=>(p.setores||[]).includes(c.setor_id)).map(p=>p.id).filter(x=>x!==eu.id);return (c.membros||[]).filter(x=>x!==eu.id);}
async function tmMidia(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:video?{width:640,height:480}:false});}catch(e){if(video){try{return await navigator.mediaDevices.getUserMedia({audio:true});}catch(x){}}toast('Sem acesso ao microfone'+(video?' ou à câmera':'')+'.');return null;}}
async function tmLkPasse(canal){
 if(window.tmLkPasseTeste)return window.tmLkPasseTeste(canal);
 const s=(await tm.auth.getSession()).data.session;if(!s)return null;
 const r=await fetch(TM_URL+'/functions/v1/teams-ligacao-token',{method:'POST',headers:{'Content-Type':'application/json',apikey:TM_KEY,Authorization:'Bearer '+s.access_token},body:JSON.stringify({canal_id:canal})}).catch(()=>null);
 if(!r)return null;const j=await r.json().catch(()=>({}));return j.ok?j:null;
}
function tmLkLocal(){const L=window.LivekitClient,lp=tmCall.lk.localParticipant,s=new MediaStream();
 [L.Track.Source.Microphone,L.Track.Source.Camera].forEach(src=>{const pub=lp.getTrackPublication(src);if(pub&&pub.track&&!pub.isMuted)s.addTrack(pub.track.mediaStreamTrack);});return s;}
async function tmLkEntrar(video){
 const L=window.LivekitClient;if(!L||!tmCall)return false;
 const p=await tmLkPasse(tmCall.canal);if(!p||!tmCall)return false;
 const room=new L.Room({adaptiveStream:true,dynacast:true});
 const ativar=()=>{if(tmCall&&tmCall.estado!=='ativa'){tmCall.estado='ativa';tmCall.inicio=tmCall.inicio||Date.now();clearTimeout(tmCall.limite);}};
 room.on(L.RoomEvent.TrackSubscribed,(track,pub,part)=>{if(!tmCall)return;let st=tmCall.remotos[part.identity];if(!st){st=new MediaStream();tmCall.remotos[part.identity]=st;}
  st.getTracks().filter(t=>t.kind===track.kind).forEach(t=>st.removeTrack(t));st.addTrack(track.mediaStreamTrack);ativar();tmDesenharLigacao();});
 room.on(L.RoomEvent.TrackUnsubscribed,(track,pub,part)=>{const st=tmCall&&tmCall.remotos[part.identity];if(st)st.removeTrack(track.mediaStreamTrack);tmDesenharLigacao();});
 room.on(L.RoomEvent.ParticipantConnected,part=>{if(!tmCall)return;tmCall.remotos[part.identity]=tmCall.remotos[part.identity]||new MediaStream();ativar();tmDesenharLigacao();});
 room.on(L.RoomEvent.ParticipantDisconnected,part=>{if(!tmCall)return;delete tmCall.remotos[part.identity];if(!room.remoteParticipants.size&&tmCall.estado==='ativa')tmEncerrar();else tmDesenharLigacao();});
 room.on(L.RoomEvent.Disconnected,()=>{if(tmCall&&tmCall.lk===room){tmCall.lk=null;tmEncerrar('A conexão caiu');}});
 try{await room.connect(p.url,p.token);}catch(e){return false;}
 if(!tmCall){room.disconnect();return false;}
 tmCall.lk=room;tmCall.modo='lk';
 try{await room.localParticipant.setMicrophoneEnabled(true);}catch(e){toast('Sem acesso ao microfone.');}
 if(video){try{await room.localParticipant.setCameraEnabled(true);}catch(e){toast('Sem acesso à câmera.');}}
 tmCall.local=tmLkLocal();
 room.remoteParticipants.forEach(part=>{tmCall.remotos[part.identity]=tmCall.remotos[part.identity]||new MediaStream();ativar();});
 return true;
}
async function tmLigar(tipo){
 if(tmCall){toast('Você já está numa ligação.');return;}
 const canal=tmAlvo();const c=tmCanais.find(x=>x.id===canal);if(!c)return;
 const alvos=tmAlvosDoCanal(c);if(!alvos.length){toast('Ninguém para chamar nesta conversa.');return;}
 const r=await tm.from('chat_chamada').insert({canal_id:canal,tipo:tipo==='video'?'video':'voz',iniciada_por:eu.id}).select('id').single();
 if(r.error){toast('Não foi possível iniciar a ligação.');return;}
 await tm.from('chat_chamada_participante').insert({chamada_id:r.data.id,usuario_id:eu.id,entrou_em:new Date().toISOString()});
 tmCall={id:r.data.id,canal,tipo,local:null,pcs:{},remotos:{},participantes:[eu.id,...alvos],estado:'chamando',inicio:null,dono:true,nome:tmNomeCanal(c),modo:'p2p'};
 tmDesenharLigacao();
 if(!(await tmLkEntrar(tipo==='video'))){if(!tmCall)return;const st=await tmMidia(tipo==='video');if(!st){tmCall=null;tmDesenharLigacao();return;}tmCall.local=st;}
 if(!tmCall)return;tmDesenharLigacao();
 alvos.forEach(u=>tmEnviarSinal(u,'ligar',{chamada:r.data.id,canal,tipo,modo:tmCall.modo,nome:eu.nome,canal_nome:tmNomeCanal(c),participantes:tmCall.participantes}));
 tmCall.limite=setTimeout(()=>{if(tmCall&&tmCall.estado==='chamando'){tmEncerrar('Chamada não atendida');}},45000);
}
function tmTocar(liga){
 if(!liga){if(tmToque){clearInterval(tmToque.i);try{tmToque.ctx.close();}catch(e){}tmToque=null;}return;}
 if(tmToque)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const bip=()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=620;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35);};bip();tmToque={ctx,i:setInterval(bip,1400)};}catch(e){}
}
function tmSinalChegou(ev,p){
 if(ev==='ligar'){
  if(tmCall){tmEnviarSinal(p.de,'ocupado',{chamada:p.chamada});return;}
  tmCall={id:p.chamada,canal:p.canal,tipo:p.tipo,modo:p.modo||'p2p',local:null,pcs:{},remotos:{},participantes:p.participantes||[p.de],estado:'tocando',de:p.de,nome:p.canal_nome,dono:false};
  tmTocar(true);tmDesenharLigacao();
  tmCall.limite=setTimeout(()=>{if(tmCall&&tmCall.estado==='tocando'){tmTocar(false);tmCall=null;tmDesenharLigacao();}},45000);
  return;}
 if(!tmCall||p.chamada!==tmCall.id)return;
 if(ev==='entrou'){if(tmCall.estado==='tocando'){return;}
  if(!tmCall.participantes.includes(p.de))tmCall.participantes.push(p.de);
  if(tmCall.estado==='chamando'){tmCall.estado='ativa';tmCall.inicio=Date.now();clearTimeout(tmCall.limite);tm.from('chat_chamada').update({atendida_em:new Date().toISOString()}).eq('id',tmCall.id);}
  if(!tmCall.lk)tmOfertar(p.de);tmDesenharLigacao();}
 else if(ev==='sdp')tmRecebeuSdp(p.de,p.sdp);
 else if(ev==='ice'){const pc=tmCall.pcs[p.de];if(pc&&p.cand)pc.addIceCandidate(p.cand).catch(()=>{});}
 else if(ev==='sair'||ev==='recusar'||ev==='ocupado'){
  if(tmCall.estado==='tocando'&&ev==='sair'&&p.de===tmCall.de){tmTocar(false);clearTimeout(tmCall.limite);tmCall=null;tmDesenharLigacao();return;}
  const pc=tmCall.pcs[p.de];if(pc){pc.close();delete tmCall.pcs[p.de];delete tmCall.remotos[p.de];}
  const ativos=Object.keys(tmCall.pcs).length;
  if(ev!=='sair'&&tmCall.estado==='chamando'){tmCall.recusas=(tmCall.recusas||0)+1;if(tmCall.recusas>=tmCall.participantes.length-1)tmEncerrar(ev==='ocupado'?'Ocupado':'Chamada recusada');else tmDesenharLigacao();return;}
  if(!ativos&&tmCall.estado==='ativa')tmEncerrar();else tmDesenharLigacao();}
}
function tmNovoPc(uid){
 const pc=new RTCPeerConnection(TM_ICE);tmCall.pcs[uid]=pc;
 if(tmCall.local)tmCall.local.getTracks().forEach(t=>pc.addTrack(t,tmCall.local));
 pc.onicecandidate=e=>{if(e.candidate)tmEnviarSinal(uid,'ice',{cand:e.candidate.toJSON()});};
 pc.ontrack=e=>{tmCall.remotos[uid]=e.streams[0];tmDesenharLigacao();};
 pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&tmCall&&tmCall.pcs[uid]===pc){delete tmCall.pcs[uid];delete tmCall.remotos[uid];if(!Object.keys(tmCall.pcs).length&&tmCall.estado==='ativa')tmEncerrar('A conexão caiu');else tmDesenharLigacao();}};
 return pc;
}
async function tmOfertar(uid){if(tmCall.pcs[uid])return;const pc=tmNovoPc(uid);const of=await pc.createOffer();await pc.setLocalDescription(of);tmEnviarSinal(uid,'sdp',{sdp:pc.localDescription.toJSON()});}
async function tmRecebeuSdp(uid,sdp){
 if(!tmCall||!sdp)return;let pc=tmCall.pcs[uid];
 if(sdp.type==='offer'){if(!pc)pc=tmNovoPc(uid);await pc.setRemoteDescription(sdp);const an=await pc.createAnswer();await pc.setLocalDescription(an);tmEnviarSinal(uid,'sdp',{sdp:pc.localDescription.toJSON()});if(tmCall.estado!=='ativa'){tmCall.estado='ativa';tmCall.inicio=Date.now();}tmDesenharLigacao();}
 else if(pc)await pc.setRemoteDescription(sdp);
}
async function tmAtender(comVideo){
 if(!tmCall||tmCall.estado!=='tocando')return;tmTocar(false);clearTimeout(tmCall.limite);
 tmCall.estado='conectando';tmDesenharLigacao();
 if(tmCall.modo==='lk'){if(!(await tmLkEntrar(comVideo))){toast('Não foi possível entrar na ligação.');tmRecusar();return;}}
 else{const st=await tmMidia(comVideo);if(!st){tmRecusar();return;}tmCall.local=st;}
 if(!tmCall)return;tmCall.inicio=tmCall.inicio||Date.now();
 tm.from('chat_chamada_participante').insert({chamada_id:tmCall.id,usuario_id:eu.id,entrou_em:new Date().toISOString()});
 tmCall.participantes.filter(u=>u!==eu.id).forEach(u=>tmEnviarSinal(u,'entrou',{}));
 tmDesenharLigacao();
}
function tmRecusar(){if(!tmCall)return;if(tmCall.lk){try{tmCall.lk.disconnect();}catch(e){}}tmTocar(false);clearTimeout(tmCall.limite);tmEnviarSinal(tmCall.de,'recusar',{});tmCall=null;tmDesenharLigacao();}
async function tmEncerrar(motivo){
 if(!tmCall)return;const c=tmCall;tmCall=null;tmTocar(false);clearTimeout(c.limite);clearInterval(c.relogio);
 c.participantes.filter(u=>u!==eu.id).forEach(u=>tmEnviarSinal(u,'sair',{chamada:c.id}));
 Object.values(c.pcs).forEach(pc=>{try{pc.close();}catch(e){}});if(c.lk){const r=c.lk;c.lk=null;try{r.disconnect();}catch(e){}}
 if(c.local)c.local.getTracks().forEach(t=>t.stop());if(c.tela)c.tela.getTracks().forEach(t=>t.stop());
 tm.from('chat_chamada_participante').update({saiu_em:new Date().toISOString()}).eq('chamada_id',c.id).eq('usuario_id',eu.id);
 if(c.dono||c.inicio){
  const dur=c.inicio?Math.round((Date.now()-c.inicio)/1000):0;const mm=String(Math.floor(dur/60)).padStart(2,'0')+':'+String(dur%60).padStart(2,'0');
  if(c.dono){await tm.from('chat_chamada').update({encerrada_em:new Date().toISOString()}).eq('id',c.id);
   await tmGravarMsg({tipo:'sistema',corpo:(c.tipo==='video'?'🎥 Chamada de vídeo':'📞 Chamada de voz')+(motivo?' · '+motivo:' · '+mm),meta:{chamada_id:c.id}},null,c.canal);
   if(tmMsgs[c.canal])tmCarregarMsgs(c.canal);}
 }
 tmDesenharLigacao();
}
async function tmMudo(){if(!tmCall)return;tmCall.mudo=!tmCall.mudo;if(tmCall.lk){await tmCall.lk.localParticipant.setMicrophoneEnabled(!tmCall.mudo);}else if(tmCall.local)tmCall.local.getAudioTracks().forEach(t=>t.enabled=!tmCall.mudo);tmDesenharLigacao();}
async function tmCamera(){if(!tmCall)return;if(tmCall.lk){const on=!tmCall.lk.localParticipant.isCameraEnabled;try{await tmCall.lk.localParticipant.setCameraEnabled(on);}catch(e){toast('Sem acesso à câmera.');}tmCall.semCam=!on;tmCall.local=tmLkLocal();tmDesenharLigacao();return;}if(!tmCall.local)return;const v=tmCall.local.getVideoTracks();if(!v.length){toast('Ligação só de voz.');return;}tmCall.semCam=!tmCall.semCam;v.forEach(t=>t.enabled=!tmCall.semCam);tmDesenharLigacao();}
async function tmTela(){
 if(tmCall&&tmCall.lk){const on=!tmCall.tela;try{await tmCall.lk.localParticipant.setScreenShareEnabled(on);tmCall.tela=on;}catch(e){toast('Não foi possível compartilhar a tela.');}tmDesenharLigacao();return;}
 if(!tmCall||!tmCall.local)return;const v=tmCall.local.getVideoTracks()[0];if(!v){toast('Compartilhar a tela só em ligação de vídeo.');return;}
 if(tmCall.tela){const t=tmCall.tela;tmCall.tela=null;t.getTracks().forEach(x=>x.stop());Object.values(tmCall.pcs).forEach(pc=>pc.getSenders().forEach(s=>{if(s.track&&s.track.kind==='video')s.replaceTrack(v);}));tmDesenharLigacao();return;}
 try{const t=await navigator.mediaDevices.getDisplayMedia({video:true});tmCall.tela=t;const tr=t.getVideoTracks()[0];
  Object.values(tmCall.pcs).forEach(pc=>pc.getSenders().forEach(s=>{if(s.track&&s.track.kind==='video')s.replaceTrack(tr);}));tr.onended=()=>{if(tmCall&&tmCall.tela)tmTela();};tmDesenharLigacao();}
 catch(e){toast('Não foi possível compartilhar a tela.');}
}
function tmDesenharLigacao(){
 let o=el('tmLig');
 if(!tmCall){if(o)o.remove();return;}
 if(!o){o=document.createElement('div');o.id='tmLig';o.className='tm-lig';document.body.appendChild(o);}
 const c=tmCall;const quem=c.dono||c.estado!=='tocando'?c.nome:tmPessoa(c.de).nome;
 if(c.estado==='tocando'){
  o.innerHTML=`<div class="tm-ligbox tm-toc"><div class="tm-av g" style="width:84px;height:84px;font-size:26px;background:${tmCor(quem)}">${escH(tmIni(quem))}</div><b>${escH(quem)}</b><span>${c.tipo==='video'?'Chamada de vídeo':'Chamada de voz'}${c.nome&&c.nome!==quem?' · '+escH(c.nome):''}</span>
   <div class="tm-ligctl"><button class="tm-lb no" onclick="tmRecusar()">Recusar</button><button class="tm-lb ok" onclick="tmAtender(false)">${ICO_FONE} Atender</button>${c.tipo==='video'?`<button class="tm-lb ok" onclick="tmAtender(true)">${ICO_CAM} Com vídeo</button>`:''}</div></div>`;
  return;}
 const rem=Object.keys(c.remotos);

 o.innerHTML=`<div class="tm-ligbox"><div class="tm-ligtop"><b>${escH(c.nome||'')}</b><span id="tmLigTempo">${tempo}</span></div>
  <div class="tm-ligpal">${rem.length?rem.map(u=>{const sv=c.remotos[u]&&c.remotos[u].getVideoTracks().length;return `<div class="tm-tile${sv?'':' vazio'}">${sv?'':`<div class="tm-av g" style="width:84px;height:84px;font-size:26px;background:${tmCor(tmPessoa(u).nome)}">${escH(tmIni(tmPessoa(u).nome))}</div>`}<video autoplay playsinline data-u="${u}"${sv?'':' style="display:none"'}></video><span>${escH(tmPessoa(u).nome)}</span></div>`;}).join(''):`<div class="tm-tile vazio"><div class="tm-av g" style="width:84px;height:84px;font-size:26px;background:${tmCor(c.nome||'')}">${escH(tmIni(c.nome||''))}</div><span>${escH(c.nome||'')}</span></div>`}
   ${c.local&&c.local.getVideoTracks().length?`<video class="tm-eu-v" autoplay playsinline muted id="tmEuV"></video>`:''}</div>
  <div class="tm-ligctl"><button class="tm-lb${c.mudo?' on':''}" onclick="tmMudo()">${c.mudo?'🔇 Sem som':'🎤 Mudo'}</button>${c.lk||c.local&&c.local.getVideoTracks().length?`<button class="tm-lb${c.semCam?' on':''}" onclick="tmCamera()">${ICO_CAM} ${c.semCam?'Ligar câmera':'Câmera'}</button><button class="tm-lb${c.tela?' on':''}" onclick="tmTela()">🖥 ${c.tela?'Parar tela':'Tela'}</button>`:''}<button class="tm-lb no" onclick="tmEncerrar()">Encerrar</button></div></div>`;
 o.querySelectorAll('video[data-u]').forEach(v=>{const s=c.remotos[v.dataset.u];if(s&&v.srcObject!==s)v.srcObject=s;});
 const ev=el('tmEuV');if(ev)ev.srcObject=c.lk?c.local:(c.tela||c.local);
 clearInterval(c.relogio);if(c.estado==='ativa')c.relogio=setInterval(()=>{const t=el('tmLigTempo');if(!t||!tmCall||!tmCall.inicio){clearInterval(c.relogio);return;}const d=Math.round((Date.now()-tmCall.inicio)/1000);t.textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');},1000);
}

  if(f.size>lim){toast(nome+' passa do limite da Meta ('+(lim/1048576)+' MB).');continue;}

function webmParaOgg(b){
 let p=0,cab=null;const pac=[];
 const vint=(marca)=>{const f=b[p];let n=1,m=0x80;while(n<=8&&!(f&m)){m>>=1;n++;}if(n>8)throw new Error('ebml');let v=marca?f:(f&(m-1));let todos=(f&(m-1))===m-1;for(let i=1;i<n;i++){v=v*256+b[p+i];if(b[p+i]!==255)todos=false;}p+=n;return {v,n,todos};};
 const MESTRES=new Set([0x18538067,0x1F43B675,0x1654AE6B,0xAE,0xA0]);
 while(p<b.length-2){const id=vint(true).v;const tam=vint(false);const ini=p;
  if(MESTRES.has(id))continue;
  const fim=tam.todos?b.length:Math.min(b.length,ini+tam.v);
  if(id===0x63A2)cab=b.slice(ini,fim);
  else if(id===0xA3||id===0xA1){p=ini;vint(false);p+=3;pac.push(b.slice(p,fim));}
  p=fim;}
 if(!cab||!pac.length)throw new Error('sem audio');
 const CRC=new Uint32Array(256);for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?((r<<1)^0x04c11db7)>>>0:(r<<1)>>>0;CRC[i]=r>>>0;}
 const serial=(Math.random()*0xffffffff)>>>0;let seq=0;const paginas=[];
 const pagina=(dado,gran,tipo)=>{const seg=[];let r=dado.length;while(r>=255){seg.push(255);r-=255;}seg.push(r);
  const h=new Uint8Array(27+seg.length+dado.length);const dv=new DataView(h.buffer);
  h.set([0x4f,0x67,0x67,0x53,0,tipo]);dv.setUint32(6,gran%4294967296,true);dv.setUint32(10,Math.floor(gran/4294967296),true);
  dv.setUint32(14,serial,true);dv.setUint32(18,seq++,true);h[26]=seg.length;h.set(seg,27);h.set(dado,27+seg.length);
  let crc=0;for(let i=0;i<h.length;i++)crc=((crc<<8)^CRC[((crc>>>24)^h[i])&0xff])>>>0;dv.setUint32(22,crc,true);paginas.push(h);};
 const amostras=x=>{const toc=x[0],cfg=toc>>3;const ms=cfg<12?[10,20,40,60][cfg%4]:cfg<16?[10,20][cfg%2]:[2.5,5,10,20][cfg%4];const c=toc&3;const nf=c===0?1:c<3?2:(x[1]&0x3f);return Math.round(nf*ms*48);};
 pagina(cab,0,2);
 const tags=new TextEncoder().encode('OpusTags');const vend=new TextEncoder().encode('fiscal');const t=new Uint8Array(8+4+vend.length+4);t.set(tags);new DataView(t.buffer).setUint32(8,vend.length,true);t.set(vend,12);pagina(t,0,0);
 let g=0;pac.forEach((x,i)=>{g+=amostras(x);pagina(x,g,i===pac.length-1?4:0);});
 const tot=paginas.reduce((s,x)=>s+x.length,0);const out=new Uint8Array(tot);let o=0;paginas.forEach(x=>{out.set(x,o);o+=x.length;});return out;
}

  <div class="grade">${flows.map(f=>`<div class="flowGrande"><b class="disp">${f.nome}</b> <span class="tag t-flow">Flow</span><div class="campos">${f.campos.map(c=>`<span class="cc">${c}</span>`).join('')}</div></div>`).join('')}</div></div>`;
}

  <div class="grade"><div class="cardP"><b class="disp">Montagem com o Meta Tools (MCP)</b><div style="font-size:11.5px;color:var(--apagado);margin-top:2px">Passo de implantação — feito uma vez ao ligar a API.</div><div style="margin-top:8px">
    <div class="passo"><div class="n">✓</div><div><b style="font-size:12.5px">Número oficial (WABA) verificado</b><div style="font-size:11.5px;color:var(--apoio)">Montado com o Meta Tools</div></div></div>
    <div class="passo"><div class="n">✓</div><div><b style="font-size:12.5px">Templates Utility aprovados</b><div style="font-size:11.5px;color:var(--apoio)">envio_guia, solicitacao_xml, lembrete_vencimento, cobranca_movimento, boas_vindas</div></div></div>

    <div class="passo"><div class="n pend">2</div><div><b style="font-size:12.5px">Flows em publicação</b><div style="font-size:11.5px;color:var(--apoio)">Enviar XMLs · Atualizar credencial</div></div></div>
  </div></div>
  <div class="cardP"><b class="disp">O que a IA faz (agente de IA · opcional)</b><div style="font-size:11.5px;color:var(--apagado);margin-top:2px">Só entra nas partes que valem a pena. Dá pra operar sem IA, só com templates/Flows.</div><div style="margin-top:10px">
    ${[['🗂️','Triagem','classifica a mensagem que chega e roteia (2ª via, XML, dúvida, cobrança)'],['🗣️','Transcrição','áudios do cliente viram texto'],['✍️','Rascunho','sugere a resposta; humano aprova'],['🧮','Apuração','lê o Relatório e confere o RBA'],['🛡️','Guardião','detecta senha em texto e troca pelo Flow seguro'],['🚩','Prioridade','marca urgência (malha/intimação)']].map(([i,t,d])=>`<div class="logIA"><div class="ic">${i}</div><div><b style="font-size:12.5px">${t}</b><div style="font-size:11.5px;color:var(--apoio)">${d}</div></div></div>`).join('')}

}

/* ---------- dados reais ---------- */
const ST_WA={enviando:'enviando',aguardando:'na fila',enviada:'enviada',entregue:'entregue',lida:'lida',falhou:'falhou'};
let sb=null,eu=null,waEntrada=[],waMeus=[],waMsgs={};
function waConv(id){return waEntrada.find(x=>x.id===id)||waMeus.find(x=>x.id===id);}
function hhmm(d){const x=new Date(d);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');}
function ddmm(d){const x=new Date(d);return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');}
function fmtTel(t){if(!t)return '';const s=String(t);return s.startsWith('55')&&s.length>=12?'+55 '+s.slice(2,4)+' '+s.slice(4,-4)+'-'+s.slice(-4):'+'+s;}
function transcWA(m){const md=Array.isArray(m.wa_midia)?m.wa_midia[0]:m.wa_midia;return md&&md.transcricao?md.transcricao:'';}
function midiaWA(m){const md=Array.isArray(m.wa_midia)?m.wa_midia[0]:m.wa_midia;return md||{};}
function msgWA(m){const tr=m.tipo==='audio'?transcWA(m):'';const md=midiaWA(m);
 return {id:m.id,id_local:m.id_local,idWa:m.id_whatsapp||null,tipo:m.tipo,transcricao:tr,d:m.direcao==='entrada'?'ent':'sai',
  t:m.texto||'',legenda:m.legenda||'',nomeArq:md.nome||(m.tipo==='documento'?m.texto:'')||'',caminho:md.estado==='guardado'?md.caminho:null,midiaEstado:md.estado||null,
  dados:m.dados||null,respondeA:m.responder_a||null,reacao:m.reacao||null,reacaoNossa:m.reacao_nossa||null,encaminhada:!!m.encaminhada,favorita:!!m.favorita,autorGrupo:m.autor_grupo||'',
  h:hhmm(m.ocorrido_em),dt:ddmm(m.ocorrido_em),em:m.ocorrido_em,st:m.status,autor:m.autor_id&&eu&&m.autor_id===eu.id?eu.nome.split(' ')[0]:''};}
function janelaWA(c){const ult=[...c.wpp].reverse().find(m=>m.d==='ent');if(!ult||!ult.em){c.janela=false;c.janelaLbl='fechada';return;}
 const rest=24*3600e3-(Date.now()-new Date(ult.em).getTime());c.janela=rest>0;c.optin=true;
 c.janelaLbl=rest>0?Math.floor(rest/3600e3)+'h'+String(Math.floor(rest%3600e3/60e3)).padStart(2,'0'):'fechada';}
function convWA(c){const ant=waConv(c.id);const ct=Array.isArray(c.wa_contato)?c.wa_contato[0]:c.wa_contato;
 const x={id:c.id,nome:c.contato_nome||fmtTel(c.contato_telefone)||'Contato',telefone:c.contato_telefone,plats:[],regime:'',optin:false,janela:false,janelaLbl:'fechada',
 dono:c.responsavel_id,wpp:waMsgs[c.id]||[],carregada:!!waMsgs[c.id],previa:c.ultima_previa,ultima:c.ultima_em,naoLidas:c.nao_lidas||0,
 arquivada:!!c.arquivada,fixada:c.fixada_em,silenciada:!!c.silenciada,marcadaNL:!!c.marcada_nao_lida,grupo:!!c.grupo_meta_id,grupoLink:c.grupo_link,grupoDesc:c.grupo_descricao,
 bloqueado:!!(ct&&ct.bloqueado)};
 if(ant&&ant._lendo)x._lendo=true;return x;}
async function carregarConversas(){
 const r=await sb.from('wa_conversa').select('id,contato_nome,contato_telefone,responsavel_id,estado,ultima_em,ultima_previa,nao_lidas,arquivada,fixada_em,silenciada,marcada_nao_lida,grupo_meta_id,grupo_link,grupo_descricao,wa_contato(bloqueado),wa_numero!inner(provedor)')
  .eq('wa_numero.provedor','meta_cloud').neq('estado','arquivada').order('ultima_em',{ascending:false,nullsFirst:false}).limit(500);
 if(r.error){toast('Não foi possível carregar as conversas.');return;}
 const nv=r.data.map(convWA);
 waEntrada=nv.filter(c=>!c.dono);
 waMeus=nv.filter(c=>c.dono===eu.id);
 waEntrada.concat(waMeus).forEach(c=>{if(c.carregada)janelaWA(c);});
}
async function carregarMensagens(id){
 const r=await sb.from('wa_mensagem').select('id,id_local,id_whatsapp,direcao,tipo,texto,legenda,status,ocorrido_em,autor_id,autor_grupo,responder_a,reacao,reacao_nossa,encaminhada,favorita,dados,wa_midia(nome,caminho,estado,mimetype,transcricao)')
  .eq('conversa_id',id).is('apagada_em',null).order('ocorrido_em',{ascending:true}).limit(1000);
 if(r.error){toast('Não foi possível carregar as mensagens.');return;}
 waMsgs[id]=r.data.map(msgWA);const c=waConv(id);if(c){c.wpp=waMsgs[id];c.carregada=true;janelaWA(c);}
 if(view==='whatsweb')render();
}
function aoMudarMidia(p){const md=p.new;if(!md||!md.mensagem_id)return;for(const k in waMsgs){const m=waMsgs[k].find(x=>x.id===md.mensagem_id);if(m){
  if(md.transcricao)m.transcricao=md.transcricao;if(md.estado==='guardado'&&md.caminho)m.caminho=md.caminho;if(md.nome)m.nomeArq=md.nome;
  if(view==='whatsweb'&&selWhats===k)waDesenharMsgs();return;}}}
function aoMudarMensagem(p){const m=p.new;if(!m||!m.conversa_id)return;const lista=waMsgs[m.conversa_id];
 if(lista){if(m.apagada_em){waMsgs[m.conversa_id]=lista.filter(x=>x.id!==m.id);const c=waConv(m.conversa_id);if(c)c.wpp=waMsgs[m.conversa_id];}
  else{const i=lista.findIndex(x=>x.id===m.id||(m.id_local&&x.id_local===m.id_local));const ant=i>=0?lista[i]:null;const nova=msgWA(m);
   if(ant){nova.caminho=ant.caminho;nova.nomeArq=nova.nomeArq||ant.nomeArq;nova.transcricao=nova.transcricao||ant.transcricao;nova.midiaEstado=ant.midiaEstado;lista[i]=nova;}else lista.push(nova);
   const c=waConv(m.conversa_id);if(c)janelaWA(c);
   if(!ant&&['imagem','audio','video','documento','figurinha'].includes(m.tipo))setTimeout(()=>carregarMensagens(m.conversa_id),1500);}}
 if(view==='whatsweb'&&selWhats===m.conversa_id)waDesenharMsgs();}
async function aoMudarConversa(){await carregarConversas();if(view==='whatsweb'){const a=document.activeElement;if(a&&(a.id==='wwin'||a.id==='wwbmsg'))return;render();}else{const b=el('waBadge');if(b)b.textContent=waPendentes();}}
async function enviarTextoWA(c,t){const id_local=crypto.randomUUID();const resp=waRespWamid(c);waResp=null;
 c.wpp.push({id:'tmp-'+id_local,id_local,tipo:'texto',d:'sai',t,respondeA:resp||null,h:hhmm(new Date()),dt:ddmm(new Date()),em:new Date().toISOString(),st:'enviando',autor:eu.nome.split(' ')[0]});render();
 const j=await waEdge('wa-meta-enviar',{conversa_id:c.id,id_local,tipo:'texto',texto:t,responder_a:resp});
 if(!j.ok){const m=c.wpp.find(x=>x.id_local===id_local);if(m)m.st='falhou';toast(j.erro||'Não foi possível enviar.');render();}}

/* ---------- entrada ---------- */
async function iniciarDados(){
 el('euAv').textContent=iniciais(eu.nome)||eu.nome.slice(0,2).toUpperCase();el('euNome').textContent=eu.nome;el('euInfo').textContent=eu.nivel+' · Fiscal';aplicarMenu();view=telaInicial();
 preCarregarGestor();
 tmIniciar();
 await carregarConversas();
 sb.channel('fiscal-wa').on('postgres_changes',{event:'*',schema:'public',table:'wa_mensagem'},aoMudarMensagem)
  .on('postgres_changes',{event:'*',schema:'public',table:'wa_conversa'},aoMudarConversa)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'wa_midia'},aoMudarMidia).subscribe();
 sb.channel('fiscal-eu').on('postgres_changes',{event:'UPDATE',schema:'public',table:'fiscal_usuario',filter:'id=eq.'+eu.id},aoMudarEu).subscribe();
 view=telaInicial();render();}
function aoMudarEu(p){const n=p.new||{};if(!n.ativo){fiscalSair();return;}const era=eGestor();eu.nivel=n.nivel;el('euInfo').textContent=eu.nivel+' · Fiscal';aplicarMenu();if(!era)preCarregarGestor();if(!podeVer(view))view=telaInicial();render();}
(async()=>{const s=await fiscalSessaoAtual();if(!s){location.href='login.html';return;}
 sb=fiscalCliente();const m=s.user.app_metadata||{};eu={id:s.user.id,nome:m.nome||s.user.email,nivel:m.fiscal_nivel||''};
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.href='login.html';});
 const u=await sb.from('fiscal_usuario').select('nivel,ativo').eq('id',eu.id).maybeSingle();if(!u.data||!u.data.ativo){fiscalSair();return;}eu.nivel=u.data.nivel;
 await iniciarDados();})();
